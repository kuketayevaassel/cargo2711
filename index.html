<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>cargo_2711 — доставка из Китая</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap&subset=cyrillic" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const db = supabase.createClient(
  "https://efsftuvvdewxvtfgssco.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVmc2Z0dXZ2ZGV3eHZ0Zmdzc2NvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2MjAyNjIsImV4cCI6MjEwMDE5NjI2Mn0.Yi1XOKPvMdMqVKAH8Ekcx61k-AUDLOsLN3U9piqkcSE"
);

const C = { paper:"#F5F4EF", card:"#FFFFFF", ink:"#14202E", inkSoft:"#5A6675",
  line:"#DCDAD2", stamp:"#C93A2B", ready:"#2E7D4F", transit:"#2B4C7E", gold:"#B8862B" };
const F = { display:"'Unbounded',sans-serif", body:"'Manrope',sans-serif", mono:"'JetBrains Mono',monospace" };

const STATUSES = [
  { label:"Ожидается", color:C.inkSoft },
  { label:"Принят на складе в Китае", color:C.gold },
  { label:"Отправлен из Китая", color:C.transit },
  { label:"Прибыл в Казахстан", color:C.transit },
  { label:"Готов к выдаче", color:C.ready },
  { label:"Выдан", color:C.stamp },
];

const phoneToEmail = p => p.replace(/\D/g,"") + "@cargo2711.kz";
function formatPhone(raw){
  let d = raw.replace(/\D/g,"");
  if(d.startsWith("8")) d = "7"+d.slice(1);
  if(!d.startsWith("7")) d = "7"+d;
  d = d.slice(0,11);
  let out = "+7";
  if(d.length>1) out += " ("+d.slice(1,4);
  if(d.length>=4) out += ") "+d.slice(4,7);
  if(d.length>=7) out += "-"+d.slice(7,9);
  if(d.length>=9) out += "-"+d.slice(9,11);
  return out;
}
const todayStr = () => { const d=new Date(); return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`; };
const priceKZT = (w, rate) => Math.round((w||0) * (rate||0));

function StatusPill({ status }) {
  const s = STATUSES[status];
  return <span className="text-xs font-semibold px-2 py-1 rounded-full"
    style={{ background:s.color+"18", color:s.color, fontFamily:F.body }}>{s.label}</span>;
}
function Dashed(){ return <div style={{borderTop:`2px dashed ${C.line}`}} className="my-4"/>; }

// ─── Экран входа / регистрации ───────────────────────────────────
function Auth() {
  const [mode,setMode]=useState("login");
  const [name,setName]=useState(""); const [phone,setPhone]=useState("");
  const [pass,setPass]=useState(""); const [busy,setBusy]=useState(false); const [err,setErr]=useState("");

  const submit = async () => {
    setErr(""); setBusy(true);
    try {
      const email = phoneToEmail(phone);
      if (mode==="register") {
        if (phone.replace(/\D/g,"").length < 10) throw new Error("Введите телефон полностью");
        if (pass.length < 6) throw new Error("Пароль минимум 6 символов");
        const { error } = await db.auth.signUp({ email, password:pass,
          options:{ data:{ full_name:name, phone } } });
        if (error) throw error;
      } else {
        const { error } = await db.auth.signInWithPassword({ email, password:pass });
        if (error) throw error;
      }
    } catch(e){
      console.error("cargo auth error:", e);
      let m = (e && e.message) ? String(e.message) : "";
      if(!m || m==="{}" || m==="[object Object]") m="Не удалось. Проверьте, что выполнили cargo-trigger.sql, и попробуйте снова";
      if(m==="Invalid login credentials") m="Неверный телефон или пароль";
      if(m==="User already registered") m="Этот телефон уже зарегистрирован — войдите";
      if(m.indexOf("Database error")>-1) m="Ошибка базы. Проверьте, что выполнили cargo-trigger.sql";
      setErr(m);
    }
    setBusy(false);
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6" style={{background:C.ink}}>
      <div className="w-full max-w-sm">
        <div className="text-center mb-8">
          <div style={{fontFamily:F.display,color:"#fff",fontSize:26,fontWeight:700,letterSpacing:1}}>
            cargo<span style={{color:C.stamp}}>_</span>2711</div>
          <div className="mt-2 text-sm" style={{color:"#9AA6B5",fontFamily:F.body}}>Доставка из Китая в Казахстан</div>
        </div>
        <div className="rounded-2xl p-6" style={{background:C.card}}>
          {mode==="register" && (<>
            <label className="block text-xs font-semibold mb-1" style={{color:C.inkSoft,fontFamily:F.body}}>Имя</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="Ваше имя"
              className="w-full rounded-lg px-3 py-3 mb-3 outline-none"
              style={{border:`1.5px solid ${C.line}`,fontFamily:F.body,fontSize:15,color:C.ink}}/>
          </>)}
          <label className="block text-xs font-semibold mb-1" style={{color:C.inkSoft,fontFamily:F.body}}>Телефон</label>
          <input value={phone} onChange={e=>setPhone(formatPhone(e.target.value))} onFocus={e=>{if(!phone)setPhone("+7 (")}}
            inputMode="numeric" placeholder="+7 (___) ___-__-__"
            className="w-full rounded-lg px-3 py-3 mb-3 outline-none"
            style={{border:`1.5px solid ${C.line}`,fontFamily:F.mono,fontSize:15,color:C.ink}}/>
          <label className="block text-xs font-semibold mb-1" style={{color:C.inkSoft,fontFamily:F.body}}>Пароль</label>
          <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••"
            className="w-full rounded-lg px-3 py-3 mb-4 outline-none"
            style={{border:`1.5px solid ${C.line}`,fontFamily:F.mono,fontSize:15,color:C.ink}}/>
          {err ? <div className="text-sm mb-3" style={{color:C.stamp,fontFamily:F.body}}>{String(err)}</div> : null}
          <button onClick={submit} disabled={busy}
            className="w-full py-3 rounded-lg font-bold text-white"
            style={{background:C.stamp,fontFamily:F.body,fontSize:15,opacity:busy?0.6:1}}>
            {busy?"Подождите…":mode==="login"?"Войти":"Зарегистрироваться"}</button>
          <Dashed/>
          <button onClick={()=>{setMode(mode==="login"?"register":"login");setErr("");}}
            className="w-full text-sm font-semibold" style={{color:C.transit,fontFamily:F.body}}>
            {mode==="login"?"Нет аккаунта? Зарегистрироваться":"Уже есть аккаунт? Войти"}</button>
        </div>
      </div>
    </div>
  );
}

// ─── Накладная (таймлайн) ────────────────────────────────────────
function Waybill({ parcel, rate, onBack }) {
  const delivered = parcel.status===5;
  const dates = parcel.status_dates||[];
  return (
    <div className="px-4 pt-4 pb-24">
      <button onClick={onBack} className="text-sm font-semibold mb-4" style={{color:C.transit,fontFamily:F.body}}>← Назад</button>
      <div className="rounded-2xl p-5 relative overflow-hidden" style={{background:C.card,border:`1px solid ${C.line}`}}>
        {delivered && <div className="absolute right-4 top-6 px-3 py-1 text-sm font-bold uppercase"
          style={{border:`3px solid ${C.stamp}`,color:C.stamp,transform:"rotate(-12deg)",fontFamily:F.display,borderRadius:6,opacity:0.85}}>Выдано</div>}
        <div className="text-xs uppercase tracking-wider mb-1" style={{color:C.inkSoft,fontFamily:F.body}}>Трек-номер</div>
        <div style={{fontFamily:F.mono,fontSize:18,fontWeight:600,color:C.ink}}>{parcel.track_number}</div>
        {parcel.title && <div className="mt-1 text-sm" style={{color:C.inkSoft,fontFamily:F.body}}>{parcel.title}</div>}
        <Dashed/>
        {STATUSES.map((s,i)=>{ const passed=i<=parcel.status; return (
          <div key={i} className="flex items-start gap-3 mb-4">
            <div className="mt-0.5 rounded-full flex-shrink-0" style={{width:14,height:14,
              background:passed?s.color:"transparent",border:`2.5px solid ${passed?s.color:C.line}`}}/>
            <div className="flex-1">
              <div className="text-sm font-semibold" style={{color:passed?C.ink:C.inkSoft,fontFamily:F.body}}>{s.label}</div>
              {dates[i] && <div className="text-xs" style={{color:C.inkSoft,fontFamily:F.mono}}>{dates[i]}</div>}
            </div>
          </div>); })}
        {parcel.weight>0 && (<>
          <Dashed/>
          <div className="flex justify-between text-sm" style={{fontFamily:F.body}}>
            <span style={{color:C.inkSoft}}>Вес</span><span style={{color:C.ink,fontFamily:F.mono}}>{Number(parcel.weight).toFixed(2)} кг</span></div>
          <div className="flex justify-between text-sm mt-2" style={{fontFamily:F.body}}>
            <span style={{color:C.inkSoft}}>К оплате ({rate} ₸/кг)</span>
            <span className="font-bold" style={{color:C.ink,fontFamily:F.mono}}>{priceKZT(parcel.weight,rate).toLocaleString("ru-RU")} ₸</span></div>
          <div className="flex justify-between text-sm mt-2" style={{fontFamily:F.body}}>
            <span style={{color:C.inkSoft}}>Оплата</span>
            <span className="font-bold" style={{color:parcel.paid?C.ready:C.stamp,fontFamily:F.body}}>{parcel.paid?"Оплачено":"Ожидает оплаты"}</span></div>
        </>)}
      </div>
    </div>
  );
}

// ─── Кабинет клиента ─────────────────────────────────────────────
function ClientApp({ session, profile, settings, onLogout }) {
  const [tab,setTab]=useState("parcels");
  const [parcels,setParcels]=useState([]); const [sel,setSel]=useState(null);
  const [newTrack,setNewTrack]=useState(""); const [copied,setCopied]=useState(false);
  const [calcW,setCalcW]=useState("1"); const [loading,setLoading]=useState(true);
  const rate = settings?.rate_per_kg||0;

  const load = async () => {
    const { data } = await db.from("parcels").select("*").order("created_at",{ascending:false});
    setParcels(data||[]); setLoading(false);
  };
  useEffect(()=>{ load(); },[]);

  const addTrack = async () => {
    const t = newTrack.trim().toUpperCase(); if (t.length<8) return;
    const { error } = await db.from("parcels").insert({ client_id:session.user.id, track_number:t });
    if (error){ alert(error.message); return; }
    setNewTrack(""); load();
  };
  const copyAddr = () => {
    const txt = `${settings.china_recipient} (${profile.client_code})\n${settings.china_phone}\n${settings.china_region}\n${settings.china_street} (${profile.client_code})`;
    navigator.clipboard?.writeText(txt); setCopied(true); setTimeout(()=>setCopied(false),1500);
  };
  const selP = parcels.find(p=>p.id===sel);

  return (
    <div className="min-h-screen" style={{background:C.paper}}>
      <div className="px-4 pt-5 pb-4" style={{background:C.ink}}>
        <div className="flex items-center justify-between">
          <div style={{fontFamily:F.display,color:"#fff",fontSize:15,fontWeight:700}}>cargo<span style={{color:C.stamp}}>_</span>2711</div>
          <button onClick={onLogout} className="text-xs" style={{color:"#9AA6B5",fontFamily:F.body}}>Выйти</button>
        </div>
        <div className="mt-4 flex items-end justify-between">
          <div><div className="text-xs" style={{color:"#9AA6B5",fontFamily:F.body}}>Ваш код клиента</div>
            <div style={{fontFamily:F.mono,color:"#fff",fontSize:24,fontWeight:600,letterSpacing:2}}>{profile.client_code}</div></div>
          <div className="text-right"><div className="text-xs" style={{color:"#9AA6B5",fontFamily:F.body}}>Тариф</div>
            <div style={{fontFamily:F.mono,color:"#fff",fontSize:15}}>{rate} ₸/кг</div></div>
        </div>
      </div>

      {selP ? <Waybill parcel={selP} rate={rate} onBack={()=>setSel(null)}/> : (
        <div className="px-4 pt-4 pb-24">
          {tab==="parcels" && (<>
            <div className="flex gap-2 mb-4">
              <input value={newTrack} onChange={e=>setNewTrack(e.target.value)} placeholder="Вставьте трек-номер"
                className="flex-1 rounded-lg px-3 py-3 outline-none"
                style={{border:`1.5px solid ${C.line}`,fontFamily:F.mono,fontSize:14,background:C.card,color:C.ink}}/>
              <button onClick={addTrack} className="px-4 rounded-lg font-bold text-white" style={{background:C.ink,fontSize:20}}>+</button>
            </div>
            {loading && <div className="text-sm text-center py-8" style={{color:C.inkSoft,fontFamily:F.body}}>Загрузка…</div>}
            {!loading && parcels.length===0 && <div className="text-sm text-center py-8" style={{color:C.inkSoft,fontFamily:F.body}}>Пока нет посылок. Добавьте трек-номер сверху.</div>}
            {parcels.map(p=>(
              <button key={p.id} onClick={()=>setSel(p.id)} className="w-full text-left rounded-2xl p-4 mb-3"
                style={{background:C.card,border:`1px solid ${C.line}`}}>
                <div className="flex items-center justify-between mb-2">
                  <span style={{fontFamily:F.mono,fontSize:14,fontWeight:600,color:C.ink}}>{p.track_number}</span>
                  <span style={{color:C.inkSoft}}>›</span></div>
                <div className="flex items-center justify-between">
                  <StatusPill status={p.status}/>
                  {p.weight>0 && <span className="text-sm font-bold" style={{fontFamily:F.mono,color:C.ink}}>{priceKZT(p.weight,rate).toLocaleString("ru-RU")} ₸</span>}
                </div></button>
            ))}
          </>)}

          {tab==="address" && (
            <div className="rounded-2xl p-5" style={{background:C.card,border:`1px solid ${C.line}`}}>
              <div className="text-sm font-bold mb-1" style={{color:C.ink,fontFamily:F.body}}>Адрес склада в Китае</div>
              <div className="text-xs mb-4" style={{color:C.inkSoft,fontFamily:F.body}}>
                Укажите этот адрес при заказе на Pinduoduo / Taobao / 1688. Обязательно добавьте ваш код <b>{profile.client_code}</b> к имени получателя.</div>
              {[["收货人 (Получатель)",`${settings.china_recipient} (${profile.client_code})`],
                ["电话 (Телефон)",settings.china_phone],
                ["地区 (Регион)",settings.china_region],
                ["详细地址 (Адрес)",`${settings.china_street} (${profile.client_code})`]].map(([k,v])=>(
                <div key={k} className="mb-3"><div className="text-xs" style={{color:C.inkSoft,fontFamily:F.body}}>{k}</div>
                  <div className="text-sm" style={{color:C.ink,fontFamily:F.mono}}>{v}</div></div>))}
              <button onClick={copyAddr} className="w-full py-3 rounded-lg font-bold text-white mt-2"
                style={{background:copied?C.ready:C.stamp,fontFamily:F.body}}>{copied?"Скопировано ✓":"Скопировать адрес"}</button>
            </div>)}

          {tab==="calc" && (
            <div className="rounded-2xl p-5" style={{background:C.card,border:`1px solid ${C.line}`}}>
              <div className="text-sm font-bold mb-3" style={{color:C.ink,fontFamily:F.body}}>Калькулятор доставки</div>
              <label className="block text-xs font-semibold mb-1" style={{color:C.inkSoft,fontFamily:F.body}}>Вес, кг</label>
              <input type="number" min="0" step="0.1" value={calcW} onChange={e=>setCalcW(e.target.value)}
                className="w-full rounded-lg px-3 py-3 outline-none mb-4"
                style={{border:`1.5px solid ${C.line}`,fontFamily:F.mono,fontSize:16,color:C.ink}}/>
              <Dashed/>
              <div className="flex justify-between text-sm mb-2" style={{fontFamily:F.body}}>
                <span style={{color:C.inkSoft}}>Тариф</span><span style={{fontFamily:F.mono,color:C.ink}}>{rate} ₸/кг</span></div>
              <div className="flex justify-between items-baseline" style={{fontFamily:F.body}}>
                <span className="text-sm" style={{color:C.inkSoft}}>Итого</span>
                <span style={{fontFamily:F.mono,fontSize:26,fontWeight:600,color:C.ink}}>{priceKZT(parseFloat(calcW)||0,rate).toLocaleString("ru-RU")} ₸</span></div>
            </div>)}
        </div>)}

      {!selP && (
        <div className="fixed bottom-0 left-0 right-0 flex" style={{background:C.card,borderTop:`1px solid ${C.line}`}}>
          {[["parcels","Посылки"],["address","Адрес склада"],["calc","Калькулятор"]].map(([id,label])=>(
            <button key={id} onClick={()=>setTab(id)} className="flex-1 py-4 text-sm font-semibold"
              style={{color:tab===id?C.stamp:C.inkSoft,fontFamily:F.body,borderTop:tab===id?`2.5px solid ${C.stamp}`:"2.5px solid transparent"}}>{label}</button>))}
        </div>)}
    </div>
  );
}

// ─── Админка ─────────────────────────────────────────────────────
function AdminApp({ settings, reloadSettings, onLogout }) {
  const [tab,setTab]=useState("parcels");
  const [parcels,setParcels]=useState([]); const [clients,setClients]=useState([]);
  const [loading,setLoading]=useState(true);
  const rate = settings?.rate_per_kg||0;

  const load = async () => {
    const { data:p } = await db.from("parcels").select("*, profiles(client_code, full_name)").order("created_at",{ascending:false});
    setParcels(p||[]);
    const { data:c } = await db.from("profiles").select("*").eq("role","client").order("created_at",{ascending:false});
    setClients(c||[]); setLoading(false);
  };
  useEffect(()=>{ load(); },[]);

  const advance = async (p) => {
    if (p.status>=5) return;
    const dates = [...(p.status_dates||[null,null,null,null,null,null])];
    dates[p.status+1] = todayStr();
    await db.from("parcels").update({ status:p.status+1, status_dates:dates }).eq("id",p.id);
    load();
  };
  const setWeight = async (p,val) => {
    const w = parseFloat(val)||0;
    await db.from("parcels").update({ weight:w }).eq("id",p.id); load();
  };
  const togglePaid = async (p) => {
    await db.from("parcels").update({ paid:!p.paid }).eq("id",p.id); load();
  };

  const inTransit = parcels.filter(p=>p.status>=1&&p.status<=3).length;
  const ready = parcels.filter(p=>p.status===4).length;
  const revenue = parcels.filter(p=>p.paid).reduce((s,p)=>s+priceKZT(p.weight,rate),0);

  return (
    <div className="min-h-screen" style={{background:C.paper}}>
      <div className="px-4 pt-5 pb-4" style={{background:C.ink}}>
        <div className="flex items-center justify-between">
          <div style={{fontFamily:F.display,color:"#fff",fontSize:15,fontWeight:700}}>cargo<span style={{color:C.stamp}}>_</span>2711 <span className="text-xs font-normal" style={{color:C.gold,fontFamily:F.body}}>· админ</span></div>
          <button onClick={onLogout} className="text-xs" style={{color:"#9AA6B5",fontFamily:F.body}}>Выйти</button>
        </div>
        <div className="mt-4 grid grid-cols-3 gap-2">
          {[["В пути",inTransit],["К выдаче",ready],["Оплачено",revenue.toLocaleString("ru-RU")+" ₸"]].map(([k,v])=>(
            <div key={k} className="rounded-xl px-3 py-2" style={{background:"#1E2C3D"}}>
              <div className="text-xs" style={{color:"#9AA6B5",fontFamily:F.body}}>{k}</div>
              <div className="text-sm font-bold" style={{color:"#fff",fontFamily:F.mono}}>{v}</div></div>))}
        </div>
      </div>

      <div className="px-4 pt-4 pb-24">
        {loading && <div className="text-sm text-center py-8" style={{color:C.inkSoft,fontFamily:F.body}}>Загрузка…</div>}

        {tab==="parcels" && !loading && parcels.length===0 && <div className="text-sm text-center py-8" style={{color:C.inkSoft,fontFamily:F.body}}>Пока нет посылок.</div>}
        {tab==="parcels" && parcels.map(p=>(
          <div key={p.id} className="rounded-2xl p-4 mb-3" style={{background:C.card,border:`1px solid ${C.line}`}}>
            <div className="flex items-center justify-between mb-1">
              <span style={{fontFamily:F.mono,fontSize:13,fontWeight:600,color:C.ink}}>{p.track_number}</span>
              <span className="text-xs" style={{fontFamily:F.mono,color:C.inkSoft}}>{p.profiles?.client_code}</span></div>
            <div className="mb-2"><StatusPill status={p.status}/></div>
            <div className="flex items-center gap-2 mb-2">
              <input type="number" min="0" step="0.1" defaultValue={p.weight||""} placeholder="вес, кг"
                onBlur={e=>e.target.value!==String(p.weight)&&setWeight(p,e.target.value)}
                className="w-24 rounded-lg px-2 py-1.5 outline-none" style={{border:`1.5px solid ${C.line}`,fontFamily:F.mono,fontSize:13,color:C.ink}}/>
              {p.weight>0 && <span className="text-xs" style={{color:C.inkSoft,fontFamily:F.mono}}>{priceKZT(p.weight,rate).toLocaleString("ru-RU")} ₸</span>}
              <button onClick={()=>togglePaid(p)} className="text-xs font-bold px-2 py-1.5 rounded-lg ml-auto"
                style={{background:(p.paid?C.ready:C.line)+"22",color:p.paid?C.ready:C.inkSoft,fontFamily:F.body}}>
                {p.paid?"Оплачено ✓":"Не оплачено"}</button>
            </div>
            {p.status<5 ? (
              <button onClick={()=>advance(p)} className="w-full text-xs font-bold py-2 rounded-lg text-white"
                style={{background:C.transit,fontFamily:F.body}}>→ {STATUSES[p.status+1].label}</button>
            ) : <div className="text-xs font-bold text-center" style={{color:C.stamp,fontFamily:F.body}}>Завершено</div>}
          </div>))}

        {tab==="clients" && !loading && clients.length===0 && <div className="text-sm text-center py-8" style={{color:C.inkSoft,fontFamily:F.body}}>Пока нет клиентов.</div>}
        {tab==="clients" && clients.map(c=>(
          <div key={c.id} className="rounded-2xl p-4 mb-3 flex items-center justify-between" style={{background:C.card,border:`1px solid ${C.line}`}}>
            <div><div className="text-sm font-bold" style={{color:C.ink,fontFamily:F.body}}>{c.full_name||"—"}</div>
              <div className="text-xs" style={{color:C.inkSoft,fontFamily:F.body}}>{c.phone}</div></div>
            <div style={{fontFamily:F.mono,fontSize:14,color:C.transit,fontWeight:600}}>{c.client_code}</div></div>))}

        {tab==="settings" && <SettingsForm settings={settings} onSaved={reloadSettings}/>}
      </div>

      <div className="fixed bottom-0 left-0 right-0 flex" style={{background:C.card,borderTop:`1px solid ${C.line}`}}>
        {[["parcels","Посылки"],["clients","Клиенты"],["settings","Настройки"]].map(([id,label])=>(
          <button key={id} onClick={()=>setTab(id)} className="flex-1 py-4 text-sm font-semibold"
            style={{color:tab===id?C.stamp:C.inkSoft,fontFamily:F.body,borderTop:tab===id?`2.5px solid ${C.stamp}`:"2.5px solid transparent"}}>{label}</button>))}
      </div>
    </div>
  );
}

function SettingsForm({ settings, onSaved }) {
  const [f,setF]=useState({ ...settings }); const [busy,setBusy]=useState(false); const [ok,setOk]=useState(false);
  const upd = (k,v)=>setF(s=>({...s,[k]:v}));
  const save = async () => {
    setBusy(true); setOk(false);
    const { error } = await db.from("settings").update({
      rate_per_kg:parseFloat(f.rate_per_kg)||0, china_recipient:f.china_recipient, china_phone:f.china_phone,
      china_region:f.china_region, china_street:f.china_street, code_prefix:f.code_prefix }).eq("id",1);
    setBusy(false);
    if (error) alert(error.message); else { setOk(true); onSaved&&onSaved(); setTimeout(()=>setOk(false),1500); }
  };
  const Field = ({label,k,type})=>(
    <div className="mb-3"><label className="block text-xs font-semibold mb-1" style={{color:C.inkSoft,fontFamily:F.body}}>{label}</label>
      <input type={type||"text"} value={f[k]||""} onChange={e=>upd(k,e.target.value)}
        className="w-full rounded-lg px-3 py-2.5 outline-none" style={{border:`1.5px solid ${C.line}`,fontFamily:F.mono,fontSize:14,color:C.ink}}/></div>);
  return (
    <div className="rounded-2xl p-5" style={{background:C.card,border:`1px solid ${C.line}`}}>
      <div className="text-sm font-bold mb-4" style={{color:C.ink,fontFamily:F.body}}>Настройки карго</div>
      <Field label="Тариф, ₸ за кг" k="rate_per_kg" type="number"/>
      <Field label="Префикс кодов клиентов" k="code_prefix"/>
      <Dashed/>
      <div className="text-xs font-bold mb-2" style={{color:C.inkSoft,fontFamily:F.body}}>Адрес склада в Китае</div>
      <Field label="收货人 Получатель" k="china_recipient"/>
      <Field label="电话 Телефон" k="china_phone"/>
      <Field label="地区 Регион" k="china_region"/>
      <Field label="详细地址 Адрес" k="china_street"/>
      <button onClick={save} disabled={busy} className="w-full py-3 rounded-lg font-bold text-white mt-2"
        style={{background:ok?C.ready:C.stamp,fontFamily:F.body,opacity:busy?0.6:1}}>{busy?"Сохранение…":ok?"Сохранено ✓":"Сохранить"}</button>
    </div>
  );
}

// ─── Корень ──────────────────────────────────────────────────────
function App() {
  const [session,setSession]=useState(undefined);
  const [profile,setProfile]=useState(null);
  const [settings,setSettings]=useState(null);
  const [ready,setReady]=useState(false);

  const loadSettings = async () => {
    const { data } = await db.from("settings").select("*").eq("id",1).single();
    setSettings(data);
  };
  const loadProfile = async () => {
    const { data } = await db.from("profiles").select("*").eq("id",(await db.auth.getUser()).data.user.id).single();
    setProfile(data);
  };

  useEffect(()=>{
    db.auth.getSession().then(({data})=>setSession(data.session));
    const { data:sub } = db.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if (session===undefined) return;
    if (!session){ setReady(true); setProfile(null); return; }
    setReady(false);
    Promise.all([loadProfile(), loadSettings()]).then(()=>setReady(true));
  },[session]);

  if (session===undefined || !ready)
    return <div className="min-h-screen flex items-center justify-center" style={{background:C.ink,color:"#9AA6B5",fontFamily:F.body}}>Загрузка…</div>;
  if (!session) return <Auth/>;
  if (!profile) return <div className="min-h-screen flex items-center justify-center px-6 text-center" style={{background:C.ink,color:"#fff",fontFamily:F.body}}>Профиль не найден. Обратитесь в поддержку.</div>;

  const logout = ()=>db.auth.signOut();
  return profile.role==="admin"
    ? <AdminApp settings={settings} reloadSettings={loadSettings} onLogout={logout}/>
    : <ClientApp session={session} profile={profile} settings={settings} onLogout={logout}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
