const phoneToEmail = p => p.replace(/\D/g,"") + "@cargo2711.kz";

function formatPhone(raw) {
  let d = raw.replace(/\D/g,"");
  if (d.startsWith("8")) d = "7" + d.slice(1);
  if (!d.startsWith("7")) d = "7" + d;
  d = d.slice(0, 11);
  let out = "+7";
  if (d.length > 1) out += " (" + d.slice(1, 4);
  if (d.length >= 4) out += ") " + d.slice(4, 7);
  if (d.length >= 7) out += "-" + d.slice(7, 9);
  if (d.length >= 9) out += "-" + d.slice(9, 11);
  return out;
}

const todayStr = () => {

};

const priceKZT = (w, rate) => Math.round((w||0) * (rate||0));
const shortTrack = t => t && t.length > 8 ? t.slice(0, 4) + "…" + t.slice(-4) : t;

// Извлечь трек-номер из результата сканирования
function extractTrack(decoded) {
  let track = decoded;
  const urlMatch = decoded.match(/\/([A-Z0-9]{8,})/i);
  if (urlMatch) track = urlMatch[1];
  return track.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
}

// Звуковой сигнал при сканировании (без файлов — чистый Web Audio)
let _audioCtx = null;
function playBeep(ok) {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    if (ctx.state === "suspended") ctx.resume();
    const tone = (freq, start, dur) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.001, ctx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + start);
      o.stop(ctx.currentTime + start + dur + 0.05);
    };
    if (ok) { tone(880, 0, 0.12); tone(1320, 0.13, 0.15); }   // «ди-дип» — успех
    else { tone(220, 0, 0.35); }                               // низкий гудок — ошибка
  } catch(_) {}
}

// ─── Компонент сканера QR ──────────────────────────────────────
// continuous=true: камера не закрывается после скана, коды дедуплицируются,
// результат каждого скана показывается баннером (prop feedback)
function QRScanner({ onScan, onClose, continuous, feedback, scanCount }) {
  const [error, setError] = useState(null);
  const [scanning, setScanning] = useState(false);
  const scannerRef = useRef(null);
  const containerRef = useRef(null);
  const firedRef = useRef(false);
  const recentRef = useRef({}); // текст → timestamp, чтобы не сканить одно и то же подряд

  useEffect(() => {
    if (!containerRef.current) return;
    const html5QrCode = new Html5Qrcode(containerRef.current.id);
    scannerRef.current = html5QrCode;

    const config = {
      fps: 10,
      qrbox: { width: 280, height: 280 },
      aspectRatio: 1,
    };

    html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        const now = Date.now();
        if (continuous) {
          // один и тот же код игнорируем 4 секунды — иначе 10 срабатываний в секунду
          const last = recentRef.current[decodedText] || 0;
          if (now - last < 4000) return;
          recentRef.current[decodedText] = now;
          if (onScan) onScan(decodedText);
        } else {
          if (firedRef.current) return;
          firedRef.current = true;
          setScanning(false);
          html5QrCode.stop().catch(() => {});
          if (onScan) onScan(decodedText);
        }
      },
      () => { /* кадры без QR — это нормально */ }
    ).then(() => setScanning(true))
    .catch(err => {
      console.error("QR error:", err);
      setError("Не удалось запустить камеру. Разрешите доступ к камере в настройках браузера.");
    });

    return () => {
      const s = scannerRef.current;
      if (s) {
        s.stop().then(() => s.clear()).catch(() => { try { s.clear(); } catch(_) {} });
      }
    };
  }, []);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center" style={{ background: "rgba(20,32,46,0.92)", backdropFilter: "blur(12px)" }}>
      <div className="relative w-full max-w-md mx-4 rounded-2xl overflow-hidden" style={{ background: C.ink, border: `1px solid ${C.stamp}44` }}>
        <div className="absolute top-4 right-4 z-10">
          <button onClick={onClose} className="w-10 h-10 rounded-full flex items-center justify-center text-white text-xl" style={{ background: C.stamp }}>✕</button>
        </div>
        <div className="p-4 text-center">
          <div className="text-sm font-semibold text-white" style={{ fontFamily: F.body }}>
            {continuous ? "Массовое сканирование" : "Наведите камеру на QR-код трека"}
          </div>
          <div className="text-xs mt-1" style={{ color: "#9AA6B5", fontFamily: F.body }}>
            {continuous
              ? "Сканируйте посылки одну за другой — камера не закроется"
              : "Сканируйте накладную или экран продавца"}
          </div>
          {continuous && scanCount > 0 && (
            <div className="mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold"
              style={{ background: C.ready + "33", color: "#7FD6A4", fontFamily: F.mono }}>
              Обработано: {scanCount}
            </div>
          )}
        </div>
        <div id="qr-reader" ref={containerRef} className="w-full" style={{ minHeight: 320, background: "#0a111a" }}></div>

        {/* Баннер с результатом последнего скана (режим "подряд") */}
        {continuous && feedback && (
          <div key={feedback.key} className="px-4 py-3 text-center text-sm font-bold flash-ok"
            style={{
              color: feedback.ok ? "#7FD6A4" : "#FF8A7A",
              fontFamily: F.body,
              borderTop: `1px solid ${C.line}22`
            }}>
            {feedback.text}
          </div>
        )}

        {error && (
          <div className="p-4 text-center">
            <div className="text-sm" style={{ color: C.stamp, fontFamily: F.body }}>{error}</div>
            <button onClick={onClose} className="mt-3 px-6 py-2 rounded-lg text-white text-sm font-bold" style={{ background: C.stamp }}>Закрыть</button>
          </div>
        )}
        {scanning && (
          <div className="absolute inset-0 pointer-events-none flex items-center justify-center">
            <div className="w-72 h-72 border-2 rounded-2xl scan-overlay"
              style={{ borderColor: C.stamp + "66" }}></div>
          </div>
        )}
        <div className="p-4 text-center border-t" style={{ borderColor: C.line + "33" }}>
          <button onClick={onClose} className="text-xs font-medium" style={{ color: "#9AA6B5", fontFamily: F.body }}>
            {continuous ? "✕ Завершить сканирование" : "✕ Закрыть сканер"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Экран входа ──────────────────────────────────────────────
function Auth() {
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [pass, setPass] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const submit = async () => {
    setErr("");
    setBusy(true);
    try {
      const email = phoneToEmail(phone);
      if (mode === "register") {
        if (phone.replace(/\D/g,"").length < 10) throw new Error("Введите телефон полностью");
        if (pass.length < 6) throw new Error("Пароль минимум 6 символов");
        const { data, error } = await db.auth.signUp({
          email,
          password: pass,
          options: { data: { full_name: name, phone } }
        });
        if (error) throw error;
        if (data?.user && !data?.session) {
          throw new Error("В Supabase включено подтверждение email. Отключите его: Authentication → Providers → Email → выключить «Confirm email».");
        }
      } else {
        const { error } = await db.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
      }
    } catch(e) {
      console.error("Auth error:", e);
      let m = e?.message || "";
      if (!m || m === "{}" || m === "[object Object]") m = "Ошибка соединения. Проверьте интернет и попробуйте снова.";
      if (m === "Invalid login credentials") m = "Неверный телефон или пароль";
      if (m === "User already registered") m = "Этот телефон уже зарегистрирован — войдите";
      if (m === "Email not confirmed") m = "Аккаунт не подтверждён. Отключите «Confirm email» в настройках Supabase и подтвердите пользователя вручную.";
      setErr(m);
    }
    setBusy(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4" style={{ background: C.ink }}>
      <div className="w-full max-w-sm slide-up">
        <div className="text-center mb-8">
          <div style={{ fontFamily: F.display, color: "#fff", fontSize: 28, fontWeight: 800, letterSpacing: 1 }}>
            cargo<span style={{ color: C.stamp }}>_</span>2711
          </div>
          <div className="mt-2 text-sm" style={{ color: "#9AA6B5", fontFamily: F.body }}>
            Доставка из Китая в Казахстан
          </div>
        </div>
        <div className="rounded-2xl p-6" style={{ background: C.card }}>
          {mode === "register" && (
            <div className="mb-3">
              <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Имя</label>
              <input value={name} onChange={e => setName(e.target.value)} placeholder="Ваше имя"
                className="w-full rounded-xl px-4 py-3 outline-none transition-all"
                style={{ border: `1.5px solid ${C.line}`, fontFamily: F.body, fontSize: 15, color: C.ink }}
                onFocus={e => e.target.style.borderColor = C.stamp}
                onBlur={e => e.target.style.borderColor = C.line} />
            </div>
          )}
          <div className="mb-3">
            <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Телефон</label>
            <input value={phone} onChange={e => setPhone(formatPhone(e.target.value))}
              inputMode="numeric" placeholder="+7 (___) ___-__-__"
              className="w-full rounded-xl px-4 py-3 outline-none transition-all"
              style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, fontSize: 15, color: C.ink }}
              onFocus={e => { e.target.style.borderColor = C.stamp; if (!phone) setPhone("+7 ("); }}
              onBlur={e => e.target.style.borderColor = C.line} />
          </div>
          <div className="mb-4">
            <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Пароль</label>
            <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="••••••••"
              className="w-full rounded-xl px-4 py-3 outline-none transition-all"
              style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, fontSize: 15, color: C.ink }}
              onFocus={e => e.target.style.borderColor = C.stamp}
              onBlur={e => e.target.style.borderColor = C.line} />
          </div>
          {err && <div className="text-sm mb-3 text-center" style={{ color: C.stamp, fontFamily: F.body }}>{err}</div>}
          <button onClick={submit} disabled={busy}
            className="w-full py-3 rounded-xl font-bold text-white transition-all active:scale-[0.98]"
            style={{ background: C.stamp, fontFamily: F.body, fontSize: 15, opacity: busy ? 0.6 : 1 }}>
            {busy ? "Подождите…" : mode === "login" ? "Войти" : "Зарегистрироваться"}
          </button>
          <div className="mt-4 text-center">
            <button onClick={() => { setMode(mode === "login" ? "register" : "login"); setErr(""); }}
              className="text-sm font-semibold" style={{ color: C.transit, fontFamily: F.body }}>
              {mode === "login" ? "Нет аккаунта? Создать" : "Уже есть аккаунт? Войти"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

        <button
          onClick={() => {
            if (confirm(`Удалить трек ${parcel.track_number}?\n\nПосылка исчезнет из отслеживания. Это действие нельзя отменить.`)) onDelete(parcel);
          }}
          className="w-full mt-4 py-3 rounded-xl text-sm font-bold transition-all active:scale-[0.98]"
          style={{ background: "transparent", color: C.stamp, border: `1.5px solid ${C.stamp}55`, fontFamily: F.body }}
        >
          🗑 Удалить трек
        </button>
      )}
    </div>
  );
}

// ─── Кабинет клиента ────────────────────────────────────────────
function ClientApp({ session, profile, settings, onLogout }) {
  const [tab, setTab] = useState("parcels");
  const [parcels, setParcels] = useState([]);
  const [sel, setSel] = useState(null);
  const [newTrack, setNewTrack] = useState("");
  const [newTitle, setNewTitle] = useState("");
  const [showAdd, setShowAdd] = useState(false);
  const [addErr, setAddErr] = useState("");
  const [loading, setLoading] = useState(true);
  const [showScanner, setShowScanner] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");
  const [copied, setCopied] = useState(false);
  const [copiedField, setCopiedField] = useState(null);
  const [calcWeight, setCalcWeight] = useState("");
  const [news, setNews] = useState([]);
  const [lastSeenNews, setLastSeen] = useState(getLastSeenNews());
  const rate = settings?.rate_per_kg || 0;

  const load = async () => {
    const { data } = await db.from("parcels").select("*").order("created_at", { ascending: false });
    setParcels(data || []);
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  // Живое обновление: админ отсканировал — статус у клиента обновился сам
  useParcelsRealtime(load);

  const loadNews = async () => {
    const { data } = await db.from("announcements")
      .select("*")
      .order("pinned", { ascending: false })
      .order("created_at", { ascending: false });
    setNews(data || []);
  };
  useEffect(() => { loadNews(); }, []);
  useNewsRealtime(loadNews);

  // когда клиент открыл вкладку — помечаем объявления прочитанными
  useEffect(() => {
    if (tab === "news" && news.length) {
      const maxId = Math.max(...news.map(n => n.id));
      setLastSeenNews(maxId);
      setLastSeen(maxId);
    }
  }, [tab, news]);

  const unreadNews = news.filter(n => n.id > lastSeenNews).length;

  // Открыть окно добавления (трек может быть уже введён или отсканирован)
  const openAdd = (track) => {
    setNewTrack((track || newTrack || "").toUpperCase());
    setAddErr("");
    setShowAdd(true);
  };

  const closeAdd = () => {
    setShowAdd(false);
    setNewTrack("");
    setNewTitle("");
    setAddErr("");
  };

  const addTrack = async () => {
    const t = newTrack.trim().toUpperCase();
    if (t.length < 6) { setAddErr("Трек-номер слишком короткий (минимум 6 символов)"); return; }
    const exists = parcels.some(p => p.track_number === t);
    if (exists) { setAddErr("Этот трек-номер уже добавлен"); return; }
    const { error } = await db.from("parcels").insert({
      client_id: session.user.id,
      track_number: t,
      title: newTitle.trim() || null
    });
    if (error) { setAddErr("Не удалось добавить: " + error.message); return; }
    closeAdd();
    load();
  };

  const deleteParcel = async (p) => {
    const { error } = await db.from("parcels").delete().eq("id", p.id);
    if (error) { alert("Не удалось удалить: " + error.message); return; }
    setSel(null);
    load();
  };

  const handleScan = (decoded) => {
    const track = extractTrack(decoded);
    setShowScanner(false);
    if (track.length >= 6) {
      openAdd(track); // после скана открываем окно — можно дописать описание
    } else {
      alert("Не удалось распознать трек-номер. Попробуйте ввести вручную.");
    }
  };

  const writeClipboard = (txt) => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt);
    } else {
      const ta = document.createElement("textarea");
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
  };

  const copyField = (key, value) => {
    writeClipboard(value);
    setCopiedField(key);
    setTimeout(() => setCopiedField(null), 1500);
  };

  const copyAddr = () => {
    const d = (profile.phone || "").replace(/\D/g, "");
    // 77007676067 → 87007676067 (казахстанский формат через 8)
    const myPhone = d ? "8" + (d.length === 11 ? d.slice(1) : d) : "";
    // trim() — защита от случайных пробелов в настройках
    const rec = (settings.china_recipient || "").trim();
    const street = (settings.china_street || "").trim();
    const region = (settings.china_region || "").trim();
    const chinaPhone = (settings.china_phone || "").trim();
    // Формат, который гарантированно распознаёт Pinduoduo/Taobao
    // (проверен на реальных сохранённых адресах):
    //   имя+код，телефон
    //   регион улица+код сотовый_клиента
    const txt = `${rec}${profile.client_code}，${chinaPhone}\n${region} ${street}${profile.client_code} ${myPhone}`;
    writeClipboard(txt);
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  const filteredParcels = parcels.filter(p =>
    p.track_number.toLowerCase().includes(searchQuery.toLowerCase()) ||
    (p.title && p.title.toLowerCase().includes(searchQuery.toLowerCase()))
  );

  const selP = parcels.find(p => p.id === sel);

  return (
    <div className="min-h-screen pb-20" style={{ background: C.paper }}>
      <div className="sticky top-0 z-20 px-4 pt-5 pb-3" style={{ background: C.ink }}>
        <div className="flex items-center justify-between">
          <div style={{ fontFamily: F.display, color: "#fff", fontSize: 16, fontWeight: 700 }}>
            cargo<span style={{ color: C.stamp }}>_</span>2711
          </div>
          <button onClick={onLogout} className="text-xs px-3 py-1.5 rounded-lg" style={{ color: "#9AA6B5", fontFamily: F.body, background: "rgba(255,255,255,0.06)" }}>
            Выйти
          </button>
        </div>
        <div className="mt-3 flex items-end justify-between">
          <div>
            <div className="text-xs" style={{ color: "#9AA6B5", fontFamily: F.body }}>Ваш код клиента</div>
            <div style={{ fontFamily: F.mono, color: "#fff", fontSize: 22, fontWeight: 600, letterSpacing: 2 }}>
              {profile.client_code}

          </div>
          <div className="text-right">
            <div className="text-xs" style={{ color: "#9AA6B5", fontFamily: F.body }}>Тариф</div>
            <div style={{ fontFamily: F.mono, color: "#fff", fontSize: 15 }}>{rate} ₸/кг</div>
          </div>
        </div>
      </div>

      {selP ? (
        <Waybill parcel={selP} rate={rate} onBack={() => setSel(null)} onDelete={deleteParcel} />

        <div className="px-4 pt-4">
          {tab === "parcels" && (

                    style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, fontSize: 14, background: C.card, color: C.ink }}
                    onKeyDown={e => e.key === "Enter" && openAdd()}
                  />
                  <button

                    style={{ background: C.stamp + "15", color: C.stamp }}

                </div>

              <div className="mb-4">

// ─── Фильтры статусов в админке ─────────────────────────────────

  { id: "all",     label: "Все посылки",            test: () => true },
  { id: "s0",      label: "⏳ Ожидается",            test: p => p.status === 0 },
  { id: "s1",      label: "📦 Принят на складе",     test: p => p.status === 1 },
  { id: "s2",      label: "✈️ Отправлен из Китая",   test: p => p.status === 2 },
  { id: "s3",      label: "📍 Прибыл в Казахстан",   test: p => p.status === 3 },
  { id: "s4",      label: "✅ Готов к выдаче",       test: p => p.status === 4 },
  { id: "s5",      label: "🎯 Выдан",                test: p => p.status === 5 },
  { id: "transit", label: "🚚 Все в пути (склад → КЗ)", test: p => p.status >= 1 && p.status <= 3 },
  { id: "unpaid",  label: "💰 Не оплачено",          test: p => !p.paid && p.weight > 0 },
];

// ─── Экспорт в Excel (CSV с BOM — открывается в Excel по двойному клику) ───
function exportToExcel(parcels, rate, fromDate, toDate) {
  const from = fromDate ? new Date(fromDate + "T00:00:00") : null;
  const to = toDate ? new Date(toDate + "T23:59:59") : null;

  const rows = parcels.filter(p => {
    const d = new Date(p.created_at);
    return (!from || d >= from) && (!to || d <= to);
  });

  if (rows.length === 0) {
    alert("За выбранный период посылок нет");
    return;
  }

  const esc = v => {
    const s = String(v == null ? "" : v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  // число с запятой — чтобы русский Excel понял его как число
  const num = v => String(v).replace(".", ",");

  const header = ["Дата добавления", "Трек-номер", "Описание", "Код клиента", "Клиент", "Статус", "Вес, кг", "Сумма, тг", "Оплачено", "Дата выдачи"];
  const lines = [header.join(";")];

  let totalWeight = 0, totalSum = 0, totalPaid = 0;

  rows.forEach(p => {
    const created = new Date(p.created_at);
    const pad = n => String(n).padStart(2, "0");
    const createdStr = `${pad(created.getDate())}.${pad(created.getMonth()+1)}.${created.getFullYear()}`;
    const sum = priceKZT(p.weight, rate);
    const issuedDate = (p.status_dates || [])[5] || "";
    totalWeight += Number(p.weight) || 0;
    totalSum += sum;
    if (p.paid) totalPaid += sum;
    lines.push([
      createdStr,
      esc(p.track_number),
      esc(p.title || ""),
      esc(p.profiles?.client_code || ""),
      esc(p.profiles?.full_name || ""),
      esc(STATUSES[p.status].label),
      num((Number(p.weight) || 0).toFixed(2)),
      sum,
      p.paid ? "Да" : "Нет",
      issuedDate
    ].join(";"));
  });

  lines.push("");
  lines.push(["ИТОГО", "", "", "", "", `Посылок: ${rows.length}`, num(totalWeight.toFixed(2)), totalSum, `Оплачено: ${totalPaid}`, ""].join(";"));

  // \uFEFF (BOM) — обязателен, иначе Excel покажет кракозябры вместо кириллицы
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `cargo2711_${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function NewsAdmin() {

  const [body, setBody] = useState("");

  const [important, setImportant] = useState(false);
  const [editId, setEditId] = useState(null);
  const [busy, setBusy] = useState(false);

  const load = async () => {
    const { data } = await db.from("announcements")
      .select("*")
      .order("pinned", { ascending: false })
      .order("created_at", { ascending: false });
    setNews(data || []);
    setLoading(false);
  };
  useEffect(() => { load(); }, []);
  useNewsRealtime(load);

  const reset = () => {
    setTitle(""); setBody(""); setPinned(false); setImportant(false); setEditId(null);
  };

  const save = async () => {
    if (!title.trim()) { alert("Введите заголовок"); return; }
    setBusy(true);
    const payload = {
      title: title.trim(),
      body: body.trim() || null,
      pinned,
      important
    };
    const { error } = editId
      ? await db.from("announcements").update(payload).eq("id", editId)
      : await db.from("announcements").insert(payload);
    setBusy(false);
    if (error) { alert("Ошибка: " + error.message); return; }
    reset();
    load();
  };

  const startEdit = (n) => {
    setEditId(n.id);
    setTitle(n.title);
    setBody(n.body || "");
    setPinned(n.pinned);
    setImportant(n.important);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const remove = async (n) => {
    if (!confirm(`Удалить объявление «${n.title}»?`)) return;
    const { error } = await db.from("announcements").delete().eq("id", n.id);
    if (error) { alert("Ошибка: " + error.message); return; }
    if (editId === n.id) reset();
    load();
  };

  const togglePin = async (n) => {
    await db.from("announcements").update({ pinned: !n.pinned }).eq("id", n.id);
    load();
  };

        <div className="text-xs mb-3" style={{ color: C.inkSoft, fontFamily: F.body }}>
          Увидят все клиенты во вкладке «Новости» — сразу, без перезахода.
        </div>

        <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Заголовок</label>

          className="w-full rounded-xl px-4 py-2.5 mb-3 outline-none"
          style={{ border: `1.5px solid ${C.line}`, fontFamily: F.body, fontSize: 14, color: C.ink }} />

        <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Текст</label>
        <textarea value={body} onChange={e => setBody(e.target.value)} rows={4}

          className="w-full rounded-xl px-4 py-2.5 mb-3 outline-none resize-y"
          style={{ border: `1.5px solid ${C.line}`, fontFamily: F.body, fontSize: 14, color: C.ink }} />

        <div className="flex gap-2 mb-4">
          <button onClick={() => setPinned(!pinned)}
            className="flex-1 text-xs font-bold py-2 rounded-lg transition-all active:scale-95"
            style={{

              border: `1.5px solid ${pinned ? C.gold + "55" : C.line}`,
              fontFamily: F.body
            }}>
            📌 Закрепить
          </button>

// «dd.mm.yyyy» → Date (для сравнения с диапазоном дат)
function parseRuDate(s) {
  if (!s) return null;
  const m = String(s).match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (!m) return null;
  return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
}

function ReportsAdmin({ parcels, rate, clients }) {
  const [stage, setStage] = useState(1);          // какой этап смотрим
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [client, setClient] = useState("");       // id клиента или ""
  const [onlyHere, setOnlyHere] = useState(false); // только те, кто сейчас на этом этапе

  const fromD = from ? new Date(from + "T00:00:00") : null;
  const toD = to ? new Date(to + "T23:59:59") : null;

  const rows = parcels.filter(p => {
    const dates = p.status_dates || [];
    const stageDate = parseRuDate(dates[stage]);
    // этап пройден, если есть его дата ИЛИ текущий статус не ниже этапа
    const passed = !!stageDate || p.status >= stage;
    if (!passed) return false;
    if (onlyHere && p.status !== stage) return false;
    if (client && p.client_id !== client) return false;
    if (fromD || toD) {
      if (!stageDate) return false;               // без даты в диапазон не попадает
      if (fromD && stageDate < fromD) return false;
      if (toD && stageDate > toD) return false;
    }
    return true;
  });

  const totalWeight = rows.reduce((s, p) => s + (Number(p.weight) || 0), 0);
  const totalSum = rows.reduce((s, p) => s + priceKZT(p.weight, rate), 0);
  const unpaidSum = rows.filter(p => !p.paid).reduce((s, p) => s + priceKZT(p.weight, rate), 0);
  const noDate = rows.filter(p => !(p.status_dates || [])[stage]).length;

  const exportReport = () => {
    if (rows.length === 0) { alert("В отчёте нет строк"); return; }
    const esc = v => {
      const s = String(v == null ? "" : v);
      return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const num = v => String(v).replace(".", ",");
    const header = ["Трек-номер", "Описание", "Код клиента", "Клиент", `Дата этапа «${STATUSES[stage].label}»`, "Текущий статус", "Вес, кг", "Сумма, тг", "Оплачено"];
    const lines = [header.join(";")];
    rows.forEach(p => {
      lines.push([
        esc(p.track_number),
        esc(p.title || ""),
        esc(p.profiles?.client_code || ""),
        esc(p.profiles?.full_name || ""),
        (p.status_dates || [])[stage] || "нет даты",
        esc(STATUSES[p.status].label),
        num((Number(p.weight) || 0).toFixed(2)),
        priceKZT(p.weight, rate),
        p.paid ? "Да" : "Нет"
      ].join(";"));
    });
    lines.push("");
    lines.push(["ИТОГО", `Посылок: ${rows.length}`, "", "", "", "", num(totalWeight.toFixed(2)), totalSum, `Не оплачено: ${unpaidSum}`].join(";"));

    const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `отчет_${STATUSES[stage].label}_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const quickRange = (days) => {
    const t = new Date();
    const f = new Date();
    f.setDate(f.getDate() - days);
    const iso = d => d.toISOString().slice(0, 10);
    setFrom(iso(f)); setTo(iso(t));
  };

  return (
    <>
      {/* Панель отбора */}
      <div className="rounded-2xl p-5 mb-4 slide-up" style={{ background: C.card, border: `1px solid ${C.line}` }}>
        <div className="text-sm font-bold mb-1" style={{ color: C.ink, fontFamily: F.body }}>📊 Отчёт по этапу</div>
        <div className="text-xs mb-3" style={{ color: C.inkSoft, fontFamily: F.body }}>
          Показывает все посылки, прошедшие выбранный этап, с датой его присвоения.
        </div>

        <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Этап</label>
        <div className="relative mb-3">
          <select value={stage} onChange={e => setStage(Number(e.target.value))}
            className="w-full rounded-xl px-4 py-2.5 pr-10 outline-none text-sm font-semibold appearance-none"
            style={{ border: `1.5px solid ${C.line}`, background: C.card, color: C.ink, fontFamily: F.body }}>
            {STATUSES.map((s, i) => (
              <option key={i} value={i} style={{ color: "#14202E", background: "#fff" }}>{s.icon} {s.label}</option>
            ))}
          </select>
          <span className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-xs" style={{ color: C.inkSoft }}>▼</span>
        </div>

        <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Дата присвоения этапа</label>
        <div className="flex gap-2 mb-2">
          <input type="date" value={from} onChange={e => setFrom(e.target.value)}
            className="flex-1 rounded-xl px-3 py-2.5 outline-none text-sm"
            style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, color: C.ink }} />
          <input type="date" value={to} onChange={e => setTo(e.target.value)}
            className="flex-1 rounded-xl px-3 py-2.5 outline-none text-sm"
            style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, color: C.ink }} />
        </div>
        <div className="flex gap-2 mb-3 flex-wrap">
          {[["Сегодня", 0], ["7 дней", 7], ["30 дней", 30]].map(([lbl, d]) => (
            <button key={lbl} onClick={() => quickRange(d)}
              className="text-xs font-bold px-3 py-1.5 rounded-lg transition-all active:scale-95"
              style={{ background: C.line + "33", color: C.inkSoft, fontFamily: F.body }}>
              {lbl}
            </button>
          ))}
          <button onClick={() => { setFrom(""); setTo(""); }}
            className="text-xs font-bold px-3 py-1.5 rounded-lg transition-all active:scale-95"
            style={{ background: C.line + "33", color: C.inkSoft, fontFamily: F.body }}>
            Все даты
          </button>
        </div>

        <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Клиент</label>
        <div className="relative mb-3">
          <select value={client} onChange={e => setClient(e.target.value)}
            className="w-full rounded-xl px-4 py-2.5 pr-10 outline-none text-sm appearance-none"
            style={{ border: `1.5px solid ${C.line}`, background: C.card, color: C.ink, fontFamily: F.body }}>
            <option value="">Все клиенты</option>
            {clients.map(c => (
              <option key={c.id} value={c.id} style={{ color: "#14202E", background: "#fff" }}>
                {c.client_code} — {c.full_name || "—"}
              </option>
            ))}
          </select>
          <span className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-xs" style={{ color: C.inkSoft }}>▼</span>
        </div>

        <button onClick={() => setOnlyHere(!onlyHere)}
          className="w-full text-xs font-bold py-2.5 rounded-lg transition-all active:scale-95 mb-3"
          style={{
            background: onlyHere ? C.ink : C.line + "22",
            color: onlyHere ? "#fff" : C.inkSoft,
            border: `1.5px solid ${onlyHere ? C.ink : C.line}`,
            fontFamily: F.body
          }}>
          {onlyHere ? "☑" : "☐"} Только застрявшие на этом этапе
        </button>

        <button onClick={exportReport}
          className="w-full py-3 rounded-xl font-bold text-white transition-all active:scale-[0.98]"
          style={{ background: C.transit, fontFamily: F.body }}>
          ⬇ Выгрузить отчёт в Excel
        </button>
      </div>

      {/* Итоги */}
      <div className="grid grid-cols-2 gap-2 mb-4">
        {[
          ["Посылок", rows.length],
          ["Вес", totalWeight.toFixed(1) + " кг"],
          ["Сумма", totalSum.toLocaleString("ru-RU") + " ₸"],
          ["Не оплачено", unpaidSum.toLocaleString("ru-RU") + " ₸"]
        ].map(([k, v], i) => (
          <div key={k} className="rounded-xl px-3 py-2.5" style={{ background: C.card, border: `1px solid ${C.line}` }}>
            <div className="text-xs" style={{ color: C.inkSoft, fontFamily: F.body }}>{k}</div>
            <div className="text-sm font-bold" style={{ color: i === 3 && unpaidSum > 0 ? C.stamp : C.ink, fontFamily: F.mono }}>{v}</div>
          </div>
        ))}
      </div>

      {noDate > 0 && (
        <div className="rounded-xl px-4 py-3 mb-3 text-xs" style={{ background: C.gold + "15", color: C.ink, border: `1px solid ${C.gold}44`, fontFamily: F.body }}>
          ⚠️ У {noDate} посылок этап пройден, но дата не записана — они были проведены до внедрения дат или статус ставили вручную.
        </div>
      )}

      {/* Таблица */}
      {rows.length === 0 ? (
        <div className="text-center py-12">
          <div className="text-4xl mb-3">🔍</div>
          <div className="text-sm" style={{ color: C.inkSoft, fontFamily: F.body }}>
            Ничего не найдено под эти условия
          </div>

      ) : (
        <div className="rounded-xl overflow-hidden mb-4" style={{ border: `1px solid ${C.line}` }}>

                <tr style={{ background: C.ink }}>
                  {["Трек", "Товар", "Клиент", "Дата этапа", "Статус сейчас", "Вес", "Сумма"].map(h => (
                    <th key={h} className="text-left px-3 py-2 text-xs font-semibold whitespace-nowrap"

                  ))}

              </thead>
              <tbody>
                {rows.map((p, i) => (
                  <tr key={p.id} style={{ background: i % 2 ? C.paper : C.card, borderTop: `1px solid ${C.line}` }}>

                    <td className="px-3 py-2 text-xs whitespace-nowrap" style={{ fontFamily: F.body, color: STATUSES[p.status].color }}>

                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </>
  );
}

  const [clientSearch, setClientSearch] = useState("");
  const [addTrackVal, setAddTrackVal] = useState("");
  const [addTitle, setAddTitle] = useState("");
  const [addScanner, setAddScanner] = useState(false);   // сканер в режиме приёмки
  const [addFeedback, setAddFeedback] = useState(null);
  const [addedCount, setAddedCount] = useState(0);
  const rate = settings?.rate_per_kg || 0;

  // актуальный список посылок для обработчика сканирования
  // (state в колбэке сканера может быть устаревшим — камера живёт дольше рендера)
  const parcelsRef = useRef([]);
  useEffect(() => { parcelsRef.current = parcels; }, [parcels]);

  const load = async () => {
    const { data: p } = await db.from("parcels").select("*, profiles(client_code, full_name)").order("created_at", { ascending: false });
    setParcels(p || []);
    const { data: c } = await db.from("profiles").select("*").eq("role", "client").order("created_at", { ascending: false });
    setClients(c || []);
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  // Живое обновление: клиент добавил трек — он сразу появился в админке
  useParcelsRealtime(load);

  // ─── СБРОС ПАРОЛЯ: админ вводит новый пароль сам, БЕЗ писем и СМС ──
  const resetUserPassword = async (user) => {
    if (!confirm(`Сменить пароль для ${user.full_name || user.phone}?`)) return;

    const newPassword = prompt(
      `Введите новый пароль для ${user.full_name || user.phone}\n` +
      `(минимум 6 символов):`
    );

    if (!newPassword) return;
    if (newPassword.length < 6) {
      alert("❌ Пароль должен быть минимум 6 символов");
      return;
    }

    try {
      const { data, error } = await db.functions.invoke('reset-password', {
        body: { user_id: user.id, new_password: newPassword }
      });

      if (error) {
        let msg = error.message || "Неизвестная ошибка";
        try {
          const body = await error.context?.json?.();
          if (body?.error) msg = body.error;
        } catch(_) {}
        throw new Error(msg);
      }
      if (data?.error) throw new Error(data.error);

      alert(`✅ Пароль для ${user.full_name || user.phone} изменён!\n\n` +
            `🔑 Новый пароль: ${newPassword}\n\n` +
            `Сообщите его пользователю лично.`);

    } catch(e) {
      console.error("Reset error:", e);
      alert(`❌ Ошибка: ${e.message || "Неизвестная ошибка"}\n\nПроверьте, что Edge Function «reset-password» развёрнута в Supabase.`);
    }
  };

  // ─── Остальные функции ──────────────────────────────────────
  const advance = async (p) => {
    if (p.status >= 5) return;
    const dates = [...(p.status_dates || [null, null, null, null, null, null])];
    dates[p.status + 1] = todayStr();
    await db.from("parcels").update({ status: p.status + 1, status_dates: dates }).eq("id", p.id);
    load();
  };

  // установить любой статус напрямую из выпадающего списка
  const setStatusDirect = async (p, newStatus) => {
    const ns = Number(newStatus);
    if (ns === p.status) return;
    const dates = [...(p.status_dates || [null, null, null, null, null, null])];
    if (ns > p.status) {
      // вперёд — проставляем даты всем пройденным этапам
      for (let i = p.status + 1; i <= ns; i++) if (!dates[i]) dates[i] = todayStr();
    } else {
      // назад — стираем даты отменённых этапов
      for (let i = ns + 1; i <= 5; i++) dates[i] = null;
    }
    const { error } = await db.from("parcels").update({ status: ns, status_dates: dates }).eq("id", p.id);
    if (error) { alert("Не удалось изменить статус: " + error.message); return; }
    load();
  };

  // откат на шаг назад — если статус проставили по ошибке
  const rollback = async (p) => {
    if (p.status <= 0) return;
    const prev = p.status - 1;
    if (!confirm(`Вернуть ${p.track_number} назад?\n\n${STATUSES[p.status].label} → ${STATUSES[prev].label}`)) return;
    const dates = [...(p.status_dates || [null, null, null, null, null, null])];
    dates[p.status] = null; // убираем дату ошибочного статуса
    const { error } = await db.from("parcels").update({ status: prev, status_dates: dates }).eq("id", p.id);
    if (error) { alert("Не удалось откатить: " + error.message); return; }
    load();
  };

  const setWeight = async (p, val) => {
    const w = parseFloat(val) || 0;
    await db.from("parcels").update({ weight: w }).eq("id", p.id);
    load();
  };

  const togglePaid = async (p) => {
    await db.from("parcels").update({ paid: !p.paid }).eq("id", p.id);
    load();
  };

  const adminDelete = async (p) => {
    if (!confirm(`Удалить посылку ${p.track_number}?\n\nОна исчезнет и у клиента ${p.profiles?.client_code || ""}. Это действие нельзя отменить.`)) return;
    const { error } = await db.from("parcels").delete().eq("id", p.id);
    if (error) { alert("Не удалось удалить: " + error.message); return; }
    load();
  };

  // ─── Массовое сканирование: камера не закрывается, статусы летят один за другим ──
  const feedbackKey = useRef(0);
  const showFeedback = (ok, text) => {
    feedbackKey.current += 1;
    setScanFeedback({ ok, text, key: feedbackKey.current });
    playBeep(ok);
    if (navigator.vibrate) navigator.vibrate(ok ? 100 : [80, 60, 80]);
  };

  const handleScan = async (decoded) => {
    const track = extractTrack(decoded);

    if (track.length < 6) {
      showFeedback(false, "❌ Не удалось распознать трек-номер");
      return;
    }

    const found = parcelsRef.current.find(p => p.track_number === track);
    if (!found) {
      showFeedback(false, `❌ ${shortTrack(track)} — не найдена в базе`);
      return;
    }

    if (found.status >= 5) {
      showFeedback(false, `⚠️ ${shortTrack(track)} — уже выдана`);
      return;
    }

    try {
      const nextStatus = found.status + 1;
      const dates = [...(found.status_dates || [null, null, null, null, null, null])];
      dates[nextStatus] = todayStr();

      const { error } = await db.from("parcels")
        .update({ status: nextStatus, status_dates: dates })
        .eq("id", found.id);

      if (error) throw error;

      showFeedback(true, `✅ ${shortTrack(track)} → ${STATUSES[nextStatus].label}`);
      setLastScanned({ id: found.id, track, from: found.status, dates: found.status_dates || null });
      setScanCount(n => n + 1);
      await load();

    } catch(e) {
      showFeedback(false, "❌ Ошибка: " + e.message);
    }
  };

  const openScanner = () => {
    setScanFeedback(null);
    setScanCount(0);
    setLastScanned(null);
    setShowScanner(true);
  };

  // отменить последнее сканирование — вернуть статус, каким он был до скана
  const undoLastScan = async () => {
    if (!lastScanned) return;
    const { error } = await db.from("parcels")
      .update({ status: lastScanned.from, status_dates: lastScanned.dates })
      .eq("id", lastScanned.id);
    if (error) { alert("Не удалось отменить: " + error.message); return; }
    showFeedback(true, `↩ ${shortTrack(lastScanned.track)} → ${STATUSES[lastScanned.from].label}`);
    setLastScanned(null);
    setScanCount(n => Math.max(0, n - 1));
    await load();
  };

  // ─── Добавление посылки админом за клиента ────────────────────
  const addFeedbackKey = useRef(0);
  const showAddFeedback = (ok, text) => {
    addFeedbackKey.current += 1;
    setAddFeedback({ ok, text, key: addFeedbackKey.current });
    playBeep(ok);
    if (navigator.vibrate) navigator.vibrate(ok ? 100 : [80, 60, 80]);
  };

  // добавляет трек выбранному клиенту; silent=true — фидбек баннером (режим сканера)
  const createParcelFor = async (trackRaw, titleVal, silent) => {
    const t = (trackRaw || "").trim().toUpperCase();
    if (!addClient) {
      const msg = "Сначала выберите клиента";
      silent ? showAddFeedback(false, "❌ " + msg) : alert(msg);
      return;
    }
    if (t.length < 6) {
      const msg = "Трек-номер слишком короткий";
      silent ? showAddFeedback(false, "❌ " + msg) : alert(msg);
      return;
    }
    const dup = parcelsRef.current.find(p => p.track_number === t);
    if (dup) {
      const who = dup.profiles?.client_code || "—";
      const msg = `Трек ${t} уже добавлен (клиент ${who})`;
      silent ? showAddFeedback(false, "⚠️ " + msg) : alert(msg);
      return;
    }
    // статус 1 — «Принят на складе», ведь коробка уже физически у нас
    const dates = [null, todayStr(), null, null, null, null];
    const { error } = await db.from("parcels").insert({
      client_id: addClient.id,
      track_number: t,
      title: (titleVal || "").trim() || null,
      status: 1,
      status_dates: dates
    });
    if (error) {
      silent ? showAddFeedback(false, "❌ " + error.message) : alert("Не удалось добавить: " + error.message);
      return;
    }
    if (silent) {
      showAddFeedback(true, `✅ ${shortTrack(t)} → ${addClient.client_code}`);
      setAddedCount(n => n + 1);
    } else {
      setAddTrackVal("");
      setAddTitle("");
      showAddFeedback(true, `✅ ${shortTrack(t)} добавлен клиенту ${addClient.client_code}`);
    }
    await load();
  };

  const handleAddScan = (decoded) => {
    createParcelFor(extractTrack(decoded), "", true);
  };

  const closeAdd = () => {
    setShowAdd(false);
    setAddScanner(false);
    setAddClient(null);
    setClientSearch("");
    setAddTrackVal("");
    setAddTitle("");
    setAddFeedback(null);
    setAddedCount(0);
  };

  const inTransit = parcels.filter(p => p.status >= 1 && p.status <= 3).length;
  const ready = parcels.filter(p => p.status === 4).length;
  const revenue = parcels.filter(p => p.paid).reduce((s, p) => s + priceKZT(p.weight, rate), 0);

  const activeFilter = ADMIN_FILTERS.find(f => f.id === statusFilter) || ADMIN_FILTERS[0];
  const filteredParcels = parcels
    .filter(p => !clientFilter || p.client_id === clientFilter.id)
    .filter(activeFilter.test)
    .filter(p =>
      p.track_number.toLowerCase().includes(searchQuery.toLowerCase()) ||
      (p.profiles?.client_code || "").toLowerCase().includes(searchQuery.toLowerCase()) ||
      (p.title || "").toLowerCase().includes(searchQuery.toLowerCase())
    );

  // сводка по выбранному клиенту
  const clientParcels = clientFilter ? parcels.filter(p => p.client_id === clientFilter.id) : [];
  const clientTotal = clientParcels.reduce((s, p) => s + priceKZT(p.weight, rate), 0);
  const clientUnpaid = clientParcels.filter(p => !p.paid && p.weight > 0).reduce((s, p) => s + priceKZT(p.weight, rate), 0);

  return (
    <div className="min-h-screen pb-20" style={{ background: C.paper }}>
      <div className="sticky top-0 z-20 px-4 pt-5 pb-3" style={{ background: C.ink }}>
        <div className="flex items-center justify-between">
          <div style={{ fontFamily: F.display, color: "#fff", fontSize: 16, fontWeight: 700 }}>
            cargo<span style={{ color: C.stamp }}>_</span>2711
            <span className="ml-2 text-xs font-normal" style={{ color: C.gold, fontFamily: F.body }}>· админ</span>
          </div>
          <button onClick={onLogout} className="text-xs px-3 py-1.5 rounded-lg" style={{ color: "#9AA6B5", fontFamily: F.body, background: "rgba(255,255,255,0.06)" }}>
            Выйти
          </button>
        </div>
        <div className="mt-3 grid grid-cols-3 gap-2">
          {[
            ["🚚 В пути", inTransit],
            ["✅ К выдаче", ready],
            ["💰 Оплачено", revenue.toLocaleString("ru-RU") + " ₸"]
          ].map(([k, v]) => (
            <div key={k} className="rounded-xl px-3 py-2" style={{ background: "rgba(255,255,255,0.06)" }}>
              <div className="text-xs" style={{ color: "#9AA6B5", fontFamily: F.body }}>{k}</div>
              <div className="text-sm font-bold" style={{ color: "#fff", fontFamily: F.mono }}>{v}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="px-4 pt-4">
        {tab === "parcels" && (
          <>
            <div className="flex gap-2 mb-3">
              <div className="flex-1 relative">
                <input
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  onKeyDown={async e => {
                    // USB-сканер «печатает» трек и жмёт Enter — обрабатываем как скан
                    if (e.key === "Enter" && searchQuery.trim().length >= 6) {
                      const q = searchQuery;
                      setSearchQuery("");
                      await handleScan(q);
                    }
                  }}
                  placeholder="🔍 Поиск / USB-сканер"
                  className="w-full rounded-xl px-4 py-3 pr-12 outline-none text-sm"
                  style={{ border: `1.5px solid ${C.line}`, fontFamily: F.body, background: C.card, color: C.ink }}
                />
                <button
                  onClick={openScanner}
                  className="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-lg flex items-center justify-center text-lg"
                  style={{ background: C.stamp + "15", color: C.stamp }}
                  title="Массовое сканирование QR-кодов"
                >
                  📷
                </button>
              </div>
              <button onClick={load} className="px-4 rounded-xl text-sm font-bold" style={{ background: C.transit, color: "#fff" }}>
                ↻
              </button>
              <button onClick={() => { setShowAdd(true); setAddClient(clientFilter ? clients.find(c => c.id === clientFilter.id) || null : null); }}
                className="px-4 rounded-xl text-xl font-bold" style={{ background: C.ink, color: "#fff" }}
                title="Добавить посылку клиенту">
                +
              </button>
            </div>

            {/* Панель выбранного клиента */}
            {clientFilter && (
              <div className="rounded-xl px-4 py-3 mb-3 flex items-center justify-between slide-up"
                style={{ background: C.ink, color: "#fff" }}>
                <div>
                  <div className="text-sm font-bold" style={{ fontFamily: F.mono }}>
                    👤 {clientFilter.code} <span style={{ fontFamily: F.body, fontWeight: 500 }}>· {clientFilter.name || "—"}</span>
                  </div>
                  <div className="text-xs mt-0.5" style={{ color: "#9AA6B5", fontFamily: F.body }}>
                    Посылок: {clientParcels.length} · Всего: {clientTotal.toLocaleString("ru-RU")} ₸
                    {clientUnpaid > 0 && <span style={{ color: "#FF8A7A" }}> · Не оплачено: {clientUnpaid.toLocaleString("ru-RU")} ₸</span>}
                  </div>
                </div>
                <button onClick={() => setClientFilter(null)}
                  className="w-8 h-8 rounded-lg flex items-center justify-center text-sm flex-shrink-0 ml-2"
                  style={{ background: "rgba(255,255,255,0.12)", color: "#fff" }}
                  title="Показать всех клиентов">
                  ✕
                </button>
              </div>
            )}

            {/* Отбор по статусу — выпадающий список */}
            <div className="relative mb-3">
              <select
                value={statusFilter}
                onChange={e => setStatusFilter(e.target.value)}
                className="w-full rounded-xl px-4 py-3 pr-10 outline-none text-sm font-semibold appearance-none"
                style={{
                  border: `1.5px solid ${statusFilter === "all" ? C.line : C.ink}`,
                  background: statusFilter === "all" ? C.card : C.ink,
                  color: statusFilter === "all" ? C.ink : "#fff",
                  fontFamily: F.body
                }}
              >
                {ADMIN_FILTERS.map(f => {
                  const cnt = parcels.filter(p => !clientFilter || p.client_id === clientFilter.id).filter(f.test).length;
                  return (
                    <option key={f.id} value={f.id} style={{ color: "#14202E", background: "#fff" }}>
                      {f.label} ({cnt})
                    </option>
                  );
                })}
              </select>
              <span className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-xs"
                style={{ color: statusFilter === "all" ? C.inkSoft : "#fff" }}>▼</span>
            </div>

            <div className="text-xs mb-3 text-center" style={{ color: C.inkSoft, fontFamily: F.body }}>
              📷 Камера — режим «подряд» · USB-сканер: кликните в поле поиска и сканируйте
            </div>

            {!showScanner && scanFeedback && (
              <div key={scanFeedback.key} className="rounded-xl px-4 py-3 mb-3 text-center text-sm font-bold flash-ok"
                style={{
                  background: scanFeedback.ok ? C.ready + "18" : C.stamp + "15",
                  color: scanFeedback.ok ? C.ready : C.stamp,
                  border: `1.5px solid ${scanFeedback.ok ? C.ready : C.stamp}33`,
                  fontFamily: F.body
                }}>
                {scanFeedback.text}
                {scanFeedback.ok && lastScanned && (
                  <button onClick={undoLastScan}
                    className="block mx-auto mt-2 text-xs font-bold px-3 py-1.5 rounded-lg transition-all active:scale-95"
                    style={{ background: C.card, color: C.inkSoft, border: `1px solid ${C.line}`, fontFamily: F.body }}>
                    ↩ Отменить: {shortTrack(lastScanned.track)}
                  </button>
                )}
              </div>
            )}

            {loading && (
              <div className="text-sm text-center py-12" style={{ color: C.inkSoft, fontFamily: F.body }}>
                <div className="inline-block w-8 h-8 border-2 rounded-full border-t-transparent animate-spin" style={{ borderColor: C.stamp }}></div>
                <div className="mt-3">Загрузка…</div>
              </div>
            )}

            {!loading && filteredParcels.length === 0 && (
              <div className="text-center py-12">
                <div className="text-4xl mb-4">📭</div>
                <div className="text-sm" style={{ color: C.inkSoft, fontFamily: F.body }}>Посылок не найдено</div>
              </div>
            )}

            {filteredParcels.map((p, idx) => (
              <div key={p.id} className="rounded-xl p-4 mb-3 slide-up"
                style={{ background: C.card, border: `1px solid ${C.line}`, animationDelay: `${idx * 20}ms` }}>
                <div className="flex items-center justify-between mb-1">
                  <span style={{ fontFamily: F.mono, fontSize: 13, fontWeight: 600, color: C.ink }}>
                    {p.track_number}
                  </span>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setClientFilter({ id: p.client_id, code: p.profiles?.client_code || "—", name: p.profiles?.full_name || "" })}
                      className="text-xs font-semibold px-2 py-0.5 rounded transition-all active:scale-95"
                      style={{ background: C.transit + "15", color: C.transit, fontFamily: F.mono }}
                      title="Показать все посылки этого клиента"
                    >
                      {p.profiles?.client_code || "—"}
                    </button>
                    <button
                      onClick={() => adminDelete(p)}
                      className="w-7 h-7 rounded-lg flex items-center justify-center text-sm transition-all active:scale-90"
                      style={{ background: C.stamp + "12", color: C.stamp }}
                      title="Удалить посылку"
                    >
                      🗑
                    </button>
                  </div>
                </div>
                {p.title && (
                  <div className="text-xs mb-1 truncate" style={{ color: C.inkSoft, fontFamily: F.body }}>
                    {p.title}
                  </div>
                )}
                <div className="flex items-center gap-2 mb-2">
                  <div className="relative">
                    <select
                      value={p.status}
                      onChange={e => setStatusDirect(p, e.target.value)}
                      className="text-xs font-semibold pl-2.5 pr-6 py-1 rounded-full appearance-none outline-none cursor-pointer"
                      style={{
                        background: STATUSES[p.status].color + "18",
                        color: STATUSES[p.status].color,
                        fontFamily: F.body,
                        border: `1px solid ${STATUSES[p.status].color}33`
                      }}
                      title="Выбрать статус"
                    >
                      {STATUSES.map((s, i) => (
                        <option key={i} value={i} style={{ color: "#14202E", background: "#fff" }}>
                          {s.icon} {s.label}
                        </option>
                      ))}
                    </select>
                    <span className="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none"
                      style={{ fontSize: 8, color: STATUSES[p.status].color }}>▼</span>
                  </div>
                  {p.paid && <span className="text-xs" style={{ color: C.ready }}>✅</span>}
                </div>
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <input type="number" min="0" step="0.1" defaultValue={p.weight || ""} placeholder="вес"
                    onBlur={e => e.target.value !== String(p.weight) && setWeight(p, e.target.value)}
                    className="w-20 rounded-lg px-2 py-1.5 outline-none text-sm"
                    style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, color: C.ink }} />
                  {p.weight > 0 && (
                    <span className="text-xs font-bold" style={{ color: C.ink, fontFamily: F.mono }}>
                      {priceKZT(p.weight, rate).toLocaleString("ru-RU")} ₸
                    </span>
                  )}
                  <button onClick={() => togglePaid(p)} className="text-xs font-bold px-2 py-1 rounded-lg ml-auto"
                    style={{ background: p.paid ? C.ready + "22" : C.line + "33", color: p.paid ? C.ready : C.inkSoft, fontFamily: F.body }}>
                    {p.paid ? "Оплачено" : "Не оплачено"}
                  </button>
                </div>
                <div className="flex gap-2">
                  {p.status > 0 && (
                    <button onClick={() => rollback(p)}
                      className="text-xs font-bold px-3 py-2 rounded-lg transition-all active:scale-95 flex-shrink-0"
                      style={{ background: C.line + "44", color: C.inkSoft, fontFamily: F.body }}
                      title={`Вернуть на «${STATUSES[p.status - 1].label}»`}>
                      ↩
                    </button>
                  )}
                  {p.status < 5 ? (
                    <button onClick={() => advance(p)} className="flex-1 text-xs font-bold py-2 rounded-lg text-white transition-all active:scale-[0.98]"
                      style={{ background: C.transit, fontFamily: F.body }}>
                      → {STATUSES[p.status + 1].label}
                    </button>
                  ) : (
                    <div className="flex-1 text-xs font-bold text-center py-2" style={{ color: C.stamp, fontFamily: F.body }}>✔ Завершено</div>
                  )}
                </div>
              </div>
            ))}
          </>
        )}

        {tab === "clients" && (
          <>
            {loading && <div className="text-sm text-center py-8" style={{ color: C.inkSoft, fontFamily: F.body }}>Загрузка…</div>}
            {!loading && clients.length === 0 && (
              <div className="text-sm text-center py-8" style={{ color: C.inkSoft, fontFamily: F.body }}>
                Пока нет клиентов.
              </div>
            )}
            {clients.map(c => (
              <div key={c.id} className="rounded-xl p-4 mb-3 slide-up"
                style={{ background: C.card, border: `1px solid ${C.line}` }}>
                <div className="flex items-center justify-between">
                  <div>
                    <div className="text-sm font-bold" style={{ color: C.ink, fontFamily: F.body }}>
                      {c.full_name || "—"}
                    </div>
                    <div className="text-xs" style={{ color: C.inkSoft, fontFamily: F.body }}>
                      {c.phone || "Нет телефона"}
                    </div>
                    <div className="text-xs mt-1" style={{ color: C.inkSoft, fontFamily: F.mono }}>
                      Код: {c.client_code}
                    </div>
                  </div>
                  <div className="flex flex-col items-end gap-2">
                    <button
                      onClick={() => {
                        setClientFilter({ id: c.id, code: c.client_code, name: c.full_name });
                        setStatusFilter("all");
                        setTab("parcels");
                      }}
                      className="text-xs font-bold px-3 py-1.5 rounded-lg transition-all active:scale-95"
                      style={{
                        background: C.transit + "18",
                        color: C.transit,
                        fontFamily: F.body,
                        border: `1px solid ${C.transit}33`
                      }}
                      title="Все посылки этого клиента"
                    >
                      📦 Посылки
                    </button>
                    <button
                      onClick={() => resetUserPassword(c)}
                      className="text-xs font-bold px-3 py-1.5 rounded-lg transition-all active:scale-95"
                      style={{
                        background: C.stamp + "22",
                        color: C.stamp,
                        fontFamily: F.body,
                        border: `1px solid ${C.stamp}33`
                      }}
                      title="Задать новый пароль пользователю"
                    >
                      🔑 Сменить пароль
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </>
        )}

        {tab === "reports" && <ReportsAdmin parcels={parcels} rate={rate} clients={clients} />}

        {tab === "news" && <NewsAdmin />}

        {tab === "settings" && (
          <>
            {/* Экспорт в Excel */}
            <div className="rounded-2xl p-5 mb-4 slide-up" style={{ background: C.card, border: `1px solid ${C.line}` }}>
              <div className="text-sm font-bold mb-1" style={{ color: C.ink, fontFamily: F.body }}>📊 Экспорт в Excel</div>
              <div className="text-xs mb-3" style={{ color: C.inkSoft, fontFamily: F.body }}>
                Все посылки за период: трек, описание, клиент, статус, вес, сумма, оплата. Файл открывается в Excel.
              </div>
              <div className="flex gap-2 mb-3">
                <div className="flex-1">
                  <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>С даты</label>
                  <input type="date" value={exportFrom} onChange={e => setExportFrom(e.target.value)}
                    className="w-full rounded-xl px-3 py-2.5 outline-none text-sm"
                    style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, color: C.ink }} />
                </div>
                <div className="flex-1">
                  <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>По дату</label>
                  <input type="date" value={exportTo} onChange={e => setExportTo(e.target.value)}
                    className="w-full rounded-xl px-3 py-2.5 outline-none text-sm"
                    style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, color: C.ink }} />
                </div>
              </div>
              <div className="text-xs mb-3" style={{ color: C.inkSoft, fontFamily: F.body }}>
                Оставьте даты пустыми, чтобы выгрузить всё.
              </div>
              <button
                onClick={() => exportToExcel(parcels, rate, exportFrom, exportTo)}
                className="w-full py-3 rounded-xl font-bold text-white transition-all active:scale-[0.98]"
                style={{ background: C.transit, fontFamily: F.body }}
              >
                ⬇ Скачать таблицу
              </button>
            </div>

            <SettingsForm settings={settings} onSaved={reloadSettings} />
          </>
        )}
      </div>

      <div className="fixed bottom-0 left-0 right-0 flex z-10" style={{ background: C.card, borderTop: `1px solid ${C.line}` }}>
        {[
          ["parcels", "📦", "Посылки"],
          ["clients", "👤", "Клиенты"],
          ["reports", "📊", "Отчёты"],
          ["news", "📣", "Новости"],
          ["settings", "⚙️", "Настройки"]
        ].map(([id, icon, label]) => (
          <button key={id} onClick={() => setTab(id)} className="flex-1 py-3 text-center"
            style={{
              color: tab === id ? C.stamp : C.inkSoft,
              fontFamily: F.body,
              borderTop: tab === id ? `3px solid ${C.stamp}` : "3px solid transparent"
            }}>
            <div className="text-lg">{icon}</div>
            <div style={{ fontSize: 10, fontWeight: 600 }}>{label}</div>
          </button>
        ))}
      </div>

      {/* ─── Окно: админ добавляет посылку клиенту ─── */}
      {showAdd && (
        <div className="fixed inset-0 z-50 flex items-center justify-center px-4"
          style={{ background: "rgba(20,32,46,0.55)", backdropFilter: "blur(6px)" }}
          onClick={closeAdd}>
          <div className="w-full max-w-sm rounded-2xl p-5 slide-up max-h-[88vh] overflow-y-auto"
            style={{ background: C.card }} onClick={e => e.stopPropagation()}>
            <div className="text-sm font-bold mb-3" style={{ color: C.ink, fontFamily: F.body }}>
              ➕ Добавить посылку клиенту
            </div>

            {/* Шаг 1 — выбор клиента */}
            {!addClient ? (
              <>
                <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>
                  Шаг 1. Выберите клиента
                </label>
                <input
                  value={clientSearch}
                  onChange={e => setClientSearch(e.target.value)}
                  placeholder="🔍 Код, имя или телефон"
                  autoFocus
                  className="w-full rounded-xl px-4 py-2.5 mb-3 outline-none text-sm"
                  style={{ border: `1.5px solid ${C.line}`, fontFamily: F.body, color: C.ink }}
                />
                <div className="space-y-2 max-h-64 overflow-y-auto">
                  {clients
                    .filter(c => {
                      const q = clientSearch.toLowerCase();
                      return !q
                        || (c.client_code || "").toLowerCase().includes(q)
                        || (c.full_name || "").toLowerCase().includes(q)
                        || (c.phone || "").replace(/\D/g, "").includes(q.replace(/\D/g, "") || "\u0000");
                    })
                    .slice(0, 30)
                    .map(c => (
                      <button key={c.id} onClick={() => setAddClient(c)}
                        className="w-full text-left rounded-xl px-3 py-2.5 transition-all active:scale-[0.98]"
                        style={{ background: C.paper, border: `1px solid ${C.line}` }}>
                        <div className="flex items-center justify-between">
                          <div>
                            <div className="text-sm font-bold" style={{ color: C.ink, fontFamily: F.body }}>
                              {c.full_name || "—"}
                            </div>
                            <div className="text-xs" style={{ color: C.inkSoft, fontFamily: F.body }}>{c.phone || ""}</div>
                          </div>
                          <span className="text-xs font-bold px-2 py-1 rounded"
                            style={{ background: C.transit + "15", color: C.transit, fontFamily: F.mono }}>
                            {c.client_code}
                          </span>
                        </div>
                      </button>
                    ))}
                  {clients.length === 0 && (
                    <div className="text-sm text-center py-4" style={{ color: C.inkSoft, fontFamily: F.body }}>
                      Клиентов пока нет
                    </div>
                  )}
                </div>
                <button onClick={closeAdd}
                  className="w-full mt-4 py-3 rounded-xl font-bold transition-all active:scale-[0.98]"
                  style={{ background: "transparent", color: C.inkSoft, border: `1.5px solid ${C.line}`, fontFamily: F.body }}>
                  Закрыть
                </button>
              </>
            ) : (
              <>
                {/* Выбранный клиент */}
                <div className="rounded-xl px-3 py-2.5 mb-4 flex items-center justify-between"
                  style={{ background: C.ink, color: "#fff" }}>
                  <div>
                    <div className="text-sm font-bold" style={{ fontFamily: F.mono }}>{addClient.client_code}</div>
                    <div className="text-xs" style={{ color: "#9AA6B5", fontFamily: F.body }}>
                      {addClient.full_name || "—"}
                    </div>
                  </div>
                  <button onClick={() => { setAddClient(null); setAddedCount(0); setAddFeedback(null); }}
                    className="text-xs font-bold px-2 py-1 rounded-lg"
                    style={{ background: "rgba(255,255,255,0.12)", color: "#fff", fontFamily: F.body }}>
                    Сменить
                  </button>
                </div>

                {/* Режим сканера: коробки подряд */}
                <button onClick={() => { setAddFeedback(null); setAddedCount(0); setAddScanner(true); }}
                  className="w-full py-3 rounded-xl font-bold text-white mb-4 transition-all active:scale-[0.98]"
                  style={{ background: C.transit, fontFamily: F.body }}>
                  📷 Сканировать коробки подряд
                </button>

                <div className="text-xs text-center mb-3" style={{ color: C.inkSoft, fontFamily: F.body }}>
                  или введите трек вручную
                </div>

                <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Трек-номер</label>
                <input
                  value={addTrackVal}
                  onChange={e => setAddTrackVal(e.target.value.toUpperCase())}
                  onKeyDown={e => {
                    // USB-сканер тоже работает: печатает трек и жмёт Enter
                    if (e.key === "Enter") createParcelFor(addTrackVal, addTitle, false);
                  }}
                  placeholder="Введите или отсканируйте"
                  autoFocus
                  className="w-full rounded-xl px-4 py-3 mb-3 outline-none"
                  style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, fontSize: 14, color: C.ink }}
                />

                <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Описание (необязательно)</label>
                <input
                  value={addTitle}
                  onChange={e => setAddTitle(e.target.value)}
                  placeholder="Например: куртка"
                  maxLength={60}
                  className="w-full rounded-xl px-4 py-3 mb-3 outline-none"
                  style={{ border: `1.5px solid ${C.line}`, fontFamily: F.body, fontSize: 14, color: C.ink }}
                />

                {addFeedback && (
                  <div key={addFeedback.key} className="rounded-xl px-3 py-2.5 mb-3 text-center text-sm font-bold flash-ok"
                    style={{
                      background: addFeedback.ok ? C.ready + "18" : C.stamp + "15",
                      color: addFeedback.ok ? C.ready : C.stamp,
                      fontFamily: F.body
                    }}>
                    {addFeedback.text}
                  </div>
                )}

                <div className="text-xs mb-3 text-center" style={{ color: C.inkSoft, fontFamily: F.body }}>
                  Посылка сразу получит статус «📦 Принят на складе»
                </div>

                <div className="flex gap-2">
                  <button onClick={closeAdd}
                    className="flex-1 py-3 rounded-xl font-bold transition-all active:scale-[0.98]"
                    style={{ background: "transparent", color: C.inkSoft, border: `1.5px solid ${C.line}`, fontFamily: F.body }}>
                    Закрыть
                  </button>
                  <button onClick={() => createParcelFor(addTrackVal, addTitle, false)}
                    className="flex-1 py-3 rounded-xl font-bold text-white transition-all active:scale-[0.98]"
                    style={{ background: C.ink, fontFamily: F.body }}>
                    Добавить
                  </button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* Сканер в режиме приёмки: каждая коробка падает выбранному клиенту */}
      {addScanner && addClient && (
        <QRScanner
          continuous
          onScan={handleAddScan}
          onClose={() => setAddScanner(false)}
          feedback={addFeedback}
          scanCount={addedCount}
        />
      )}

      {showScanner && (
        <QRScanner
          continuous
          onScan={handleScan}
          onClose={() => setShowScanner(false)}
          feedback={scanFeedback}
          scanCount={scanCount}
        />
      )}
    </div>
  );
}

// ─── Поле настроек (вне SettingsForm — иначе инпут теряет фокус) ───
function SettingsField({ label, value, onChange, type }) {
  return (
    <div className="mb-3">
      <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>{label}</label>
      <input type={type || "text"} value={value || ""} onChange={e => onChange(e.target.value)}
        className="w-full rounded-xl px-4 py-2.5 outline-none"
        style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, fontSize: 14, color: C.ink }} />
    </div>
  );
}

// ─── Настройки ──────────────────────────────────────────────────
function SettingsForm({ settings, onSaved }) {
  const [f, setF] = useState({ ...settings });
  const [busy, setBusy] = useState(false);
  const [ok, setOk] = useState(false);
  const upd = (k, v) => setF(s => ({ ...s, [k]: v }));

  const save = async () => {
    setBusy(true);
    setOk(false);
    const { error } = await db.from("settings").update({
      rate_per_kg: parseFloat(f.rate_per_kg) || 0,
      china_recipient: f.china_recipient,
      china_phone: f.china_phone,
      china_region: f.china_region,
      china_street: f.china_street,
      code_prefix: f.code_prefix
    }).eq("id", 1);
    setBusy(false);
    if (error) alert(error.message);
    else { setOk(true); if (onSaved) onSaved(); setTimeout(() => setOk(false), 1500); }
  };

  return (
    <div className="rounded-2xl p-5 slide-up" style={{ background: C.card, border: `1px solid ${C.line}` }}>
      <div className="text-sm font-bold mb-4" style={{ color: C.ink, fontFamily: F.body }}>⚙️ Настройки карго</div>
      <SettingsField label="Тариф, ₸ за кг" value={f.rate_per_kg} onChange={v => upd("rate_per_kg", v)} type="number" />
      <SettingsField label="Префикс кодов клиентов" value={f.code_prefix} onChange={v => upd("code_prefix", v)} />
      <div className="my-4" style={{ borderTop: `2px dashed ${C.line}` }}></div>
      <div className="text-xs font-bold mb-2" style={{ color: C.inkSoft, fontFamily: F.body }}>📍 Адрес склада в Китае</div>
      <SettingsField label="收货人 Получатель" value={f.china_recipient} onChange={v => upd("china_recipient", v)} />
      <SettingsField label="电话 Телефон" value={f.china_phone} onChange={v => upd("china_phone", v)} />
      <SettingsField label="地区 Регион" value={f.china_region} onChange={v => upd("china_region", v)} />
      <SettingsField label="详细地址 Адрес" value={f.china_street} onChange={v => upd("china_street", v)} />
      <button onClick={save} disabled={busy} className="w-full py-3 rounded-xl font-bold text-white mt-2 transition-all active:scale-[0.98]"
        style={{ background: ok ? C.ready : C.stamp, fontFamily: F.body, opacity: busy ? 0.6 : 1 }}>
        {busy ? "Сохранение…" : ok ? "✅ Сохранено" : "💾 Сохранить"}
      </button>
    </div>
  );
}

// ─── Корень ─────────────────────────────────────────────────────
function App() {
  const [session, setSession] = useState(undefined);
  const [profile, setProfile] = useState(null);
  const [settings, setSettings] = useState(null);
  const [ready, setReady] = useState(false);

  const loadSettings = async () => {
    const { data } = await db.from("settings").select("*").eq("id", 1).single();
    setSettings(data);
  };

  const loadProfile = async (userId) => {
    if (!userId) { setProfile(null); return; }
    const { data } = await db.from("profiles").select("*").eq("id", userId).single();
    setProfile(data);
  };

  useEffect(() => {
    db.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = db.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (session === undefined) return;
    if (!session) { setReady(true); setProfile(null); return; }
    setReady(false);
    Promise.all([loadProfile(session.user.id), loadSettings()]).then(() => setReady(true));
  }, [session]);

  if (session === undefined || !ready) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center" style={{ background: C.ink }}>
        <div className="inline-block w-10 h-10 rounded-full border-t-transparent animate-spin"
          style={{ border: `3px solid ${C.stamp}`, borderTopColor: "transparent" }}></div>
        <div className="mt-4 text-sm" style={{ color: "#9AA6B5", fontFamily: F.body }}>Загрузка…</div>
      </div>
    );
  }

  if (!session) return <Auth />;
  if (!profile) return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center gap-4" style={{ background: C.ink, color: "#fff", fontFamily: F.body }}>
      <div>Профиль не найден. Обратитесь в поддержку.</div>
      <button onClick={() => db.auth.signOut()} className="px-6 py-2 rounded-lg text-sm font-bold" style={{ background: C.stamp, color: "#fff" }}>
        Выйти
      </button>
    </div>
  );

  const logout = () => db.auth.signOut();
  return profile.role === "admin"
    ? <AdminApp settings={settings} reloadSettings={loadSettings} onLogout={logout} />
    : <ClientApp session={session} profile={profile} settings={settings} onLogout={logout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
