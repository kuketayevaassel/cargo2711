const phoneToEmail = p => p.replace(/\D/g,"") + "@cargo2711.kz";

function formatPhone(raw) {
  let d = raw.replace(/\D/g,"");
  if (d.startsWith("8")) d = "7" + d.slice(1);
  if (!d.startsWith("7")) d = "7" + d;
  d = d.slice(0, 11);
  let out = "+7";
  if (d.length > 1) out += " (" + d.slice(1, 4);
  if (d.length >= 4) out += ") " + d.slice(4, 7);
  if (d.length >= 7) out += "-" + d.slice(7, 9);
  if (d.length >= 9) out += "-" + d.slice(9, 11);
  return out;
}

const todayStr = () => {

};

const priceKZT = (w, rate) => Math.round((w||0) * (rate||0));

// Извлечь трек-номер из результата сканирования
function extractTrack(decoded) {
  let track = decoded;
  const urlMatch = decoded.match(/\/([A-Z0-9]{8,})/i);
  if (urlMatch) track = urlMatch[1];
  return track.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
}

// Звуковой сигнал при сканировании (без файлов — чистый Web Audio)
let _audioCtx = null;
function playBeep(ok) {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    if (ctx.state === "suspended") ctx.resume();
    const tone = (freq, start, dur) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.001, ctx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + start);
      o.stop(ctx.currentTime + start + dur + 0.05);
    };
    if (ok) { tone(880, 0, 0.12); tone(1320, 0.13, 0.15); }   // «ди-дип» — успех
    else { tone(220, 0, 0.35); }                               // низкий гудок — ошибка
  } catch(_) {}
}

// ─── Компонент сканера QR ──────────────────────────────────────
// continuous=true: камера не закрывается после скана, коды дедуплицируются,
// результат каждого скана показывается баннером (prop feedback)
function QRScanner({ onScan, onClose, continuous, feedback, scanCount }) {
  const [error, setError] = useState(null);
  const [scanning, setScanning] = useState(false);
  const scannerRef = useRef(null);
  const containerRef = useRef(null);
  const firedRef = useRef(false);
  const recentRef = useRef({}); // текст → timestamp, чтобы не сканить одно и то же подряд

  useEffect(() => {
    if (!containerRef.current) return;
    const html5QrCode = new Html5Qrcode(containerRef.current.id);
    scannerRef.current = html5QrCode;

    const config = {
      fps: 10,
      qrbox: { width: 280, height: 280 },
      aspectRatio: 1,
    };

    html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        const now = Date.now();
        if (continuous) {
          // один и тот же код игнорируем 4 секунды — иначе 10 срабатываний в секунду
          const last = recentRef.current[decodedText] || 0;
          if (now - last < 4000) return;
          recentRef.current[decodedText] = now;
          if (onScan) onScan(decodedText);
        } else {
          if (firedRef.current) return;
          firedRef.current = true;
          setScanning(false);
          html5QrCode.stop().catch(() => {});
          if (onScan) onScan(decodedText);
        }
      },
      () => { /* кадры без QR — это нормально */ }
    ).then(() => setScanning(true))
    .catch(err => {
      console.error("QR error:", err);
      setError("Не удалось запустить камеру. Разрешите доступ к камере в настройках браузера.");
    });

    return () => {
      const s = scannerRef.current;
      if (s) {
        s.stop().then(() => s.clear()).catch(() => { try { s.clear(); } catch(_) {} });
      }
    };
  }, []);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center" style={{ background: "rgba(20,32,46,0.92)", backdropFilter: "blur(12px)" }}>
      <div className="relative w-full max-w-md mx-4 rounded-2xl overflow-hidden" style={{ background: C.ink, border: `1px solid ${C.stamp}44` }}>
        <div className="absolute top-4 right-4 z-10">
          <button onClick={onClose} className="w-10 h-10 rounded-full flex items-center justify-center text-white text-xl" style={{ background: C.stamp }}>✕</button>
        </div>
        <div className="p-4 text-center">
          <div className="text-sm font-semibold text-white" style={{ fontFamily: F.body }}>
            {continuous ? "Массовое сканирование" : "Наведите камеру на QR-код трека"}
          </div>
          <div className="text-xs mt-1" style={{ color: "#9AA6B5", fontFamily: F.body }}>
            {continuous
              ? "Сканируйте посылки одну за другой — камера не закроется"
              : "Сканируйте накладную или экран продавца"}
          </div>
          {continuous && scanCount > 0 && (
            <div className="mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold"
              style={{ background: C.ready + "33", color: "#7FD6A4", fontFamily: F.mono }}>
              Обработано: {scanCount}
            </div>
          )}
        </div>
        <div id="qr-reader" ref={containerRef} className="w-full" style={{ minHeight: 320, background: "#0a111a" }}></div>

        {/* Баннер с результатом последнего скана (режим "подряд") */}
        {continuous && feedback && (
          <div key={feedback.key} className="px-4 py-3 text-center text-sm font-bold flash-ok"
            style={{
              color: feedback.ok ? "#7FD6A4" : "#FF8A7A",
              fontFamily: F.body,
              borderTop: `1px solid ${C.line}22`
            }}>
            {feedback.text}
          </div>
        )}

        {error && (
          <div className="p-4 text-center">
            <div className="text-sm" style={{ color: C.stamp, fontFamily: F.body }}>{error}</div>
            <button onClick={onClose} className="mt-3 px-6 py-2 rounded-lg text-white text-sm font-bold" style={{ background: C.stamp }}>Закрыть</button>
          </div>
        )}
        {scanning && (
          <div className="absolute inset-0 pointer-events-none flex items-center justify-center">
            <div className="w-72 h-72 border-2 rounded-2xl scan-overlay"
              style={{ borderColor: C.stamp + "66" }}></div>
          </div>
        )}
        <div className="p-4 text-center border-t" style={{ borderColor: C.line + "33" }}>
          <button onClick={onClose} className="text-xs font-medium" style={{ color: "#9AA6B5", fontFamily: F.body }}>
            {continuous ? "✕ Завершить сканирование" : "✕ Закрыть сканер"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Экран входа ──────────────────────────────────────────────
function Auth() {
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [pass, setPass] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const submit = async () => {
    setErr("");
    setBusy(true);
    try {
      const email = phoneToEmail(phone);
      if (mode === "register") {
        if (phone.replace(/\D/g,"").length < 10) throw new Error("Введите телефон полностью");
        if (pass.length < 6) throw new Error("Пароль минимум 6 символов");
        const { data, error } = await db.auth.signUp({
          email,
          password: pass,
          options: { data: { full_name: name, phone } }
        });
        if (error) throw error;
        if (data?.user && !data?.session) {
          throw new Error("В Supabase включено подтверждение email. Отключите его: Authentication → Providers → Email → выключить «Confirm email».");
        }
      } else {
        const { error } = await db.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
      }
    } catch(e) {
      console.error("Auth error:", e);
      let m = e?.message || "";
      if (!m || m === "{}" || m === "[object Object]") m = "Ошибка соединения. Проверьте интернет и попробуйте снова.";
      if (m === "Invalid login credentials") m = "Неверный телефон или пароль";
      if (m === "User already registered") m = "Этот телефон уже зарегистрирован — войдите";
      if (m === "Email not confirmed") m = "Аккаунт не подтверждён. Отключите «Confirm email» в настройках Supabase и подтвердите пользователя вручную.";
      setErr(m);
    }
    setBusy(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4" style={{ background: C.ink }}>
      <div className="w-full max-w-sm slide-up">
        <div className="text-center mb-8">
          <div style={{ fontFamily: F.display, color: "#fff", fontSize: 28, fontWeight: 800, letterSpacing: 1 }}>
            cargo<span style={{ color: C.stamp }}>_</span>2711
          </div>
          <div className="mt-2 text-sm" style={{ color: "#9AA6B5", fontFamily: F.body }}>
            Доставка из Китая в Казахстан
          </div>
        </div>
        <div className="rounded-2xl p-6" style={{ background: C.card }}>
          {mode === "register" && (
            <div className="mb-3">
              <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Имя</label>
              <input value={name} onChange={e => setName(e.target.value)} placeholder="Ваше имя"
                className="w-full rounded-xl px-4 py-3 outline-none transition-all"
                style={{ border: `1.5px solid ${C.line}`, fontFamily: F.body, fontSize: 15, color: C.ink }}
                onFocus={e => e.target.style.borderColor = C.stamp}
                onBlur={e => e.target.style.borderColor = C.line} />
            </div>
          )}
          <div className="mb-3">
            <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Телефон</label>
            <input value={phone} onChange={e => setPhone(formatPhone(e.target.value))}
              inputMode="numeric" placeholder="+7 (___) ___-__-__"
              className="w-full rounded-xl px-4 py-3 outline-none transition-all"
              style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, fontSize: 15, color: C.ink }}
              onFocus={e => { e.target.style.borderColor = C.stamp; if (!phone) setPhone("+7 ("); }}
              onBlur={e => e.target.style.borderColor = C.line} />
          </div>
          <div className="mb-4">
            <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Пароль</label>
            <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="••••••••"
              className="w-full rounded-xl px-4 py-3 outline-none transition-all"
              style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, fontSize: 15, color: C.ink }}
              onFocus={e => e.target.style.borderColor = C.stamp}
              onBlur={e => e.target.style.borderColor = C.line} />
          </div>
          {err && <div className="text-sm mb-3 text-center" style={{ color: C.stamp, fontFamily: F.body }}>{err}</div>}
          <button onClick={submit} disabled={busy}
            className="w-full py-3 rounded-xl font-bold text-white transition-all active:scale-[0.98]"
            style={{ background: C.stamp, fontFamily: F.body, fontSize: 15, opacity: busy ? 0.6 : 1 }}>
            {busy ? "Подождите…" : mode === "login" ? "Войти" : "Зарегистрироваться"}
          </button>
          <div className="mt-4 text-center">
            <button onClick={() => { setMode(mode === "login" ? "register" : "login"); setErr(""); }}
              className="text-sm font-semibold" style={{ color: C.transit, fontFamily: F.body }}>
              {mode === "login" ? "Нет аккаунта? Создать" : "Уже есть аккаунт? Войти"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Накладная ──────────────────────────────────────────────────
function Waybill({ parcel, rate, onBack, onDelete }) {
  const delivered = parcel.status === 5;
  const dates = parcel.status_dates || [];

  return (
    <div className="px-4 pt-4 pb-28 slide-up">
      <button onClick={onBack} className="flex items-center gap-2 text-sm font-semibold mb-4" style={{ color: C.transit, fontFamily: F.body }}>
        <span>‹</span> Назад
      </button>
      <div className="rounded-2xl p-5 relative overflow-hidden" style={{ background: C.card, border: `1px solid ${C.line}` }}>
        {delivered && (
          <div className="absolute -right-8 top-6 px-8 py-1 text-xs font-black uppercase rotate-12"
            style={{ background: C.stamp, color: "#fff", fontFamily: F.display }}>
            Выдано
          </div>
        )}
        <div className="text-xs uppercase tracking-wider mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>Трек-номер</div>
        <div style={{ fontFamily: F.mono, fontSize: 20, fontWeight: 600, color: C.ink, letterSpacing: 1 }}>{parcel.track_number}</div>
        {parcel.title && <div className="mt-1 text-sm" style={{ color: C.inkSoft, fontFamily: F.body }}>{parcel.title}</div>}

        <div className="mt-4" style={{ borderTop: `2px dashed ${C.line}` }}></div>

        <div className="mt-4 space-y-0">
          {STATUSES.map((s, i) => {
            const passed = i <= parcel.status;
            const isActive = i === parcel.status;
            return (
              <div key={i} className="flex items-start gap-3 py-3 relative">
                {i < STATUSES.length - 1 && (
                  <div className="absolute left-[6px] top-[32px] w-[2px] h-[calc(100%-12px)]"
                    style={{ background: passed ? s.color : C.line }}></div>
                )}
                <div className="relative z-10 mt-0.5 rounded-full flex-shrink-0 transition-all duration-500"
                  style={{
                    width: isActive ? 18 : 14,
                    height: isActive ? 18 : 14,
                    background: passed ? s.color : "transparent",
                    border: `2.5px solid ${passed ? s.color : C.line}`,
                    boxShadow: isActive ? `0 0 0 4px ${s.color}22` : "none"
                  }}>
                  {isActive && (
                    <div className="absolute -inset-1 rounded-full animate-pulse"
                      style={{ background: s.color + "33" }}></div>
                  )}
                </div>
                <div className="flex-1">
                  <div className="flex items-center gap-2">
                    <span className="text-sm font-semibold" style={{ color: passed ? C.ink : C.inkSoft, fontFamily: F.body }}>
                      {s.label}
                    </span>
                    {passed && <span className="text-xs" style={{ color: C.inkSoft }}>{s.icon}</span>}
                  </div>
                  {dates[i] && (
                    <div className="text-xs" style={{ color: C.inkSoft, fontFamily: F.mono }}>{dates[i]}</div>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        {parcel.weight > 0 && (
          <>
            <div style={{ borderTop: `2px dashed ${C.line}` }} className="my-4"></div>
            <div className="space-y-2">
              <div className="flex justify-between text-sm" style={{ fontFamily: F.body }}>
                <span style={{ color: C.inkSoft }}>Вес</span>
                <span style={{ color: C.ink, fontFamily: F.mono }}>{Number(parcel.weight).toFixed(2)} кг</span>
              </div>
              <div className="flex justify-between text-sm" style={{ fontFamily: F.body }}>
                <span style={{ color: C.inkSoft }}>К оплате ({rate} ₸/кг)</span>
                <span className="font-bold" style={{ color: C.ink, fontFamily: F.mono, fontSize: 17 }}>
                  {priceKZT(parcel.weight, rate).toLocaleString("ru-RU")} ₸
                </span>
              </div>
              <div className="flex justify-between text-sm" style={{ fontFamily: F.body }}>
                <span style={{ color: C.inkSoft }}>Оплата</span>
                <span className="font-bold" style={{ color: parcel.paid ? C.ready : C.stamp, fontFamily: F.body }}>
                  {parcel.paid ? "✅ Оплачено" : "⏳ Ожидает оплаты"}
                </span>
              </div>
            </div>
          </>
        )}
      </div>

      {/* Удалить можно только пока посылка «Ожидается» — до приёмки на складе */}
      {onDelete && parcel.status === 0 && (
        <button
          onClick={() => {
            if (confirm(`Удалить трек ${parcel.track_number}?\n\nЭто действие нельзя отменить.`)) onDelete(parcel);
          }}
          className="w-full mt-4 py-3 rounded-xl text-sm font-bold transition-all active:scale-[0.98]"
          style={{ background: "transparent", color: C.stamp, border: `1.5px solid ${C.stamp}55`, fontFamily: F.body }}

          🗑 Удалить трек

        <div className="mt-4 text-xs text-center" style={{ color: C.inkSoft, fontFamily: F.body }}>
          Посылка уже принята на складе — удалить её нельзя
        </div>
      )}
    </div>
  );
}

  const [copied, setCopied] = useState(false);
  const [calcWeight, setCalcWeight] = useState("");

// ─── Фильтры статусов в админке ─────────────────────────────────
const ADMIN_FILTERS = [
  { id: "all",     label: "Все",           test: () => true },
  { id: "waiting", label: "⏳ Ожидаются",   test: p => p.status === 0 },
  { id: "transit", label: "🚚 В пути",      test: p => p.status >= 1 && p.status <= 3 },
  { id: "ready",   label: "✅ К выдаче",    test: p => p.status === 4 },
  { id: "done",    label: "🎯 Выданы",      test: p => p.status === 5 },
  { id: "unpaid",  label: "💰 Не оплачено", test: p => !p.paid && p.weight > 0 },
];

// ─── Экспорт в Excel (CSV с BOM — открывается в Excel по двойному клику) ───
function exportToExcel(parcels, rate, fromDate, toDate) {
  const from = fromDate ? new Date(fromDate + "T00:00:00") : null;
  const to = toDate ? new Date(toDate + "T23:59:59") : null;

  const rows = parcels.filter(p => {
    const d = new Date(p.created_at);
    return (!from || d >= from) && (!to || d <= to);
  });

  if (rows.length === 0) {
    alert("За выбранный период посылок нет");
    return;
  }

  const esc = v => {
    const s = String(v == null ? "" : v);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  // число с запятой — чтобы русский Excel понял его как число
  const num = v => String(v).replace(".", ",");

  const header = ["Дата добавления", "Трек-номер", "Код клиента", "Клиент", "Статус", "Вес, кг", "Сумма, тг", "Оплачено", "Дата выдачи"];
  const lines = [header.join(";")];

  let totalWeight = 0, totalSum = 0, totalPaid = 0;

  rows.forEach(p => {
    const created = new Date(p.created_at);
    const pad = n => String(n).padStart(2, "0");
    const createdStr = `${pad(created.getDate())}.${pad(created.getMonth()+1)}.${created.getFullYear()}`;
    const sum = priceKZT(p.weight, rate);
    const issuedDate = (p.status_dates || [])[5] || "";
    totalWeight += Number(p.weight) || 0;
    totalSum += sum;
    if (p.paid) totalPaid += sum;
    lines.push([
      createdStr,
      esc(p.track_number),
      esc(p.profiles?.client_code || ""),
      esc(p.profiles?.full_name || ""),
      esc(STATUSES[p.status].label),
      num((Number(p.weight) || 0).toFixed(2)),
      sum,
      p.paid ? "Да" : "Нет",
      issuedDate
    ].join(";"));
  });

  lines.push("");
  lines.push(["ИТОГО", "", "", "", `Посылок: ${rows.length}`, num(totalWeight.toFixed(2)), totalSum, `Оплачено: ${totalPaid}`, ""].join(";"));

  // \uFEFF (BOM) — обязателен, иначе Excel покажет кракозябры вместо кириллицы
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `cargo2711_${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ─── Админка ─────────────────────────────────────────────────────
function AdminApp({ settings, reloadSettings, onLogout }) {
  const [tab, setTab] = useState("parcels");
  const [parcels, setParcels] = useState([]);
  const [clients, setClients] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showScanner, setShowScanner] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [scanFeedback, setScanFeedback] = useState(null);
  const [scanCount, setScanCount] = useState(0);
  const [exportFrom, setExportFrom] = useState("");
  const [exportTo, setExportTo] = useState("");
  const rate = settings?.rate_per_kg || 0;

  // актуальный список посылок для обработчика сканирования
  // (state в колбэке сканера может быть устаревшим — камера живёт дольше рендера)
  const parcelsRef = useRef([]);
  useEffect(() => { parcelsRef.current = parcels; }, [parcels]);

  const load = async () => {
    const { data: p } = await db.from("parcels").select("*, profiles(client_code, full_name)").order("created_at", { ascending: false });
    setParcels(p || []);
    const { data: c } = await db.from("profiles").select("*").eq("role", "client").order("created_at", { ascending: false });
    setClients(c || []);
    setLoading(false);
  };
  useEffect(() => { load(); }, []);

  // Живое обновление: клиент добавил трек — он сразу появился в админке
  useParcelsRealtime(load);

  // ─── СБРОС ПАРОЛЯ: админ вводит новый пароль сам, БЕЗ писем и СМС ──
  const resetUserPassword = async (user) => {
    if (!confirm(`Сменить пароль для ${user.full_name || user.phone}?`)) return;

    const newPassword = prompt(
      `Введите новый пароль для ${user.full_name || user.phone}\n` +
      `(минимум 6 символов):`
    );

    if (!newPassword) return;
    if (newPassword.length < 6) {
      alert("❌ Пароль должен быть минимум 6 символов");
      return;
    }

    try {
      const { data, error } = await db.functions.invoke('reset-password', {
        body: { user_id: user.id, new_password: newPassword }
      });

      if (error) {
        let msg = error.message || "Неизвестная ошибка";
        try {
          const body = await error.context?.json?.();
          if (body?.error) msg = body.error;
        } catch(_) {}
        throw new Error(msg);
      }
      if (data?.error) throw new Error(data.error);

      alert(`✅ Пароль для ${user.full_name || user.phone} изменён!\n\n` +
            `🔑 Новый пароль: ${newPassword}\n\n` +
            `Сообщите его пользователю лично.`);

    } catch(e) {
      console.error("Reset error:", e);
      alert(`❌ Ошибка: ${e.message || "Неизвестная ошибка"}\n\nПроверьте, что Edge Function «reset-password» развёрнута в Supabase.`);
    }
  };

  // ─── Остальные функции ──────────────────────────────────────
  const advance = async (p) => {
    if (p.status >= 5) return;
    const dates = [...(p.status_dates || [null, null, null, null, null, null])];
    dates[p.status + 1] = todayStr();
    await db.from("parcels").update({ status: p.status + 1, status_dates: dates }).eq("id", p.id);
    load();
  };

  const setWeight = async (p, val) => {
    const w = parseFloat(val) || 0;
    await db.from("parcels").update({ weight: w }).eq("id", p.id);
    load();
  };

  const togglePaid = async (p) => {
    await db.from("parcels").update({ paid: !p.paid }).eq("id", p.id);
    load();
  };

  // ─── Массовое сканирование: камера не закрывается, статусы летят один за другим ──
  const feedbackKey = useRef(0);
  const showFeedback = (ok, text) => {
    feedbackKey.current += 1;
    setScanFeedback({ ok, text, key: feedbackKey.current });
    playBeep(ok);
    if (navigator.vibrate) navigator.vibrate(ok ? 100 : [80, 60, 80]);
  };

  const handleScan = async (decoded) => {
    const track = extractTrack(decoded);

    if (track.length < 6) {
      showFeedback(false, "❌ Не удалось распознать трек-номер");
      return;
    }

    const found = parcelsRef.current.find(p => p.track_number === track);
    if (!found) {
      showFeedback(false, `❌ ${shortTrack(track)} — не найдена в базе`);
      return;
    }

    if (found.status >= 5) {
      showFeedback(false, `⚠️ ${shortTrack(track)} — уже выдана`);
      return;
    }

    try {
      const nextStatus = found.status + 1;
      const dates = [...(found.status_dates || [null, null, null, null, null, null])];
      dates[nextStatus] = todayStr();

      const { error } = await db.from("parcels")
        .update({ status: nextStatus, status_dates: dates })
        .eq("id", found.id);

      if (error) throw error;

      showFeedback(true, `✅ ${shortTrack(track)} → ${STATUSES[nextStatus].label}`);
      setScanCount(n => n + 1);
      await load();

    } catch(e) {
      showFeedback(false, "❌ Ошибка: " + e.message);
    }
  };

  const openScanner = () => {
    setScanFeedback(null);
    setScanCount(0);
    setShowScanner(true);
  };

  const inTransit = parcels.filter(p => p.status >= 1 && p.status <= 3).length;
  const ready = parcels.filter(p => p.status === 4).length;
  const revenue = parcels.filter(p => p.paid).reduce((s, p) => s + priceKZT(p.weight, rate), 0);

  const activeFilter = ADMIN_FILTERS.find(f => f.id === statusFilter) || ADMIN_FILTERS[0];
  const filteredParcels = parcels
    .filter(activeFilter.test)
    .filter(p =>
      p.track_number.toLowerCase().includes(searchQuery.toLowerCase()) ||
      (p.profiles?.client_code || "").toLowerCase().includes(searchQuery.toLowerCase())
    );

  return (
    <div className="min-h-screen pb-20" style={{ background: C.paper }}>
      <div className="sticky top-0 z-20 px-4 pt-5 pb-3" style={{ background: C.ink }}>
        <div className="flex items-center justify-between">
          <div style={{ fontFamily: F.display, color: "#fff", fontSize: 16, fontWeight: 700 }}>
            cargo<span style={{ color: C.stamp }}>_</span>2711
            <span className="ml-2 text-xs font-normal" style={{ color: C.gold, fontFamily: F.body }}>· админ</span>
          </div>
          <button onClick={onLogout} className="text-xs px-3 py-1.5 rounded-lg" style={{ color: "#9AA6B5", fontFamily: F.body, background: "rgba(255,255,255,0.06)" }}>
            Выйти
          </button>
        </div>
        <div className="mt-3 grid grid-cols-3 gap-2">
          {[
            ["🚚 В пути", inTransit],
            ["✅ К выдаче", ready],
            ["💰 Оплачено", revenue.toLocaleString("ru-RU") + " ₸"]
          ].map(([k, v]) => (
            <div key={k} className="rounded-xl px-3 py-2" style={{ background: "rgba(255,255,255,0.06)" }}>
              <div className="text-xs" style={{ color: "#9AA6B5", fontFamily: F.body }}>{k}</div>
              <div className="text-sm font-bold" style={{ color: "#fff", fontFamily: F.mono }}>{v}</div>
            </div>
          ))}
        </div>
      </div>

      <div className="px-4 pt-4">
        {tab === "parcels" && (
          <>
            <div className="flex gap-2 mb-3">
              <div className="flex-1 relative">
                <input
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="🔍 Поиск по треку или коду клиента"
                  className="w-full rounded-xl px-4 py-3 pr-12 outline-none text-sm"
                  style={{ border: `1.5px solid ${C.line}`, fontFamily: F.body, background: C.card, color: C.ink }}
                />
                <button
                  onClick={openScanner}
                  className="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-lg flex items-center justify-center text-lg"
                  style={{ background: C.stamp + "15", color: C.stamp }}
                  title="Массовое сканирование QR-кодов"
                >
                  📷
                </button>
              </div>
              <button onClick={load} className="px-4 rounded-xl text-sm font-bold" style={{ background: C.transit, color: "#fff" }}>
                ↻
              </button>
            </div>

            {/* Фильтры по статусу */}
            <div className="flex gap-2 mb-3 overflow-x-auto pb-1" style={{ scrollbarWidth: "none" }}>
              {ADMIN_FILTERS.map(f => {
                const cnt = f.id === "all" ? parcels.length : parcels.filter(f.test).length;
                const active = statusFilter === f.id;
                return (
                  <button
                    key={f.id}
                    onClick={() => setStatusFilter(f.id)}
                    className="flex-shrink-0 text-xs font-bold px-3 py-1.5 rounded-full transition-all active:scale-95"
                    style={{
                      background: active ? C.ink : C.card,
                      color: active ? "#fff" : C.inkSoft,
                      border: `1.5px solid ${active ? C.ink : C.line}`,
                      fontFamily: F.body
                    }}
                  >
                    {f.label} <span style={{ fontFamily: F.mono, opacity: 0.75 }}>{cnt}</span>
                  </button>
                );
              })}
            </div>

            <div className="text-xs mb-3 text-center" style={{ color: C.inkSoft, fontFamily: F.body }}>
              📷 Режим «подряд»: сканируйте посылки одну за другой, камера не закрывается
            </div>

            {loading && (
              <div className="text-sm text-center py-12" style={{ color: C.inkSoft, fontFamily: F.body }}>
                <div className="inline-block w-8 h-8 border-2 rounded-full border-t-transparent animate-spin" style={{ borderColor: C.stamp }}></div>
                <div className="mt-3">Загрузка…</div>
              </div>
            )}

            {!loading && filteredParcels.length === 0 && (
              <div className="text-center py-12">
                <div className="text-4xl mb-4">📭</div>
                <div className="text-sm" style={{ color: C.inkSoft, fontFamily: F.body }}>Посылок не найдено</div>
              </div>
            )}

            {filteredParcels.map((p, idx) => (
              <div key={p.id} className="rounded-xl p-4 mb-3 slide-up"
                style={{ background: C.card, border: `1px solid ${C.line}`, animationDelay: `${idx * 20}ms` }}>
                <div className="flex items-center justify-between mb-1">
                  <span style={{ fontFamily: F.mono, fontSize: 13, fontWeight: 600, color: C.ink }}>
                    {p.track_number}
                  </span>
                  <span className="text-xs font-semibold px-2 py-0.5 rounded"
                    style={{ background: C.transit + "15", color: C.transit, fontFamily: F.mono }}>
                    {p.profiles?.client_code || "—"}
                  </span>
                </div>
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-xs font-semibold px-2 py-0.5 rounded-full"
                    style={{ background: STATUSES[p.status].color + "18", color: STATUSES[p.status].color, fontFamily: F.body }}>
                    {STATUSES[p.status].icon} {STATUSES[p.status].label}
                  </span>
                  {p.paid && <span className="text-xs" style={{ color: C.ready }}>✅</span>}
                </div>
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <input type="number" min="0" step="0.1" defaultValue={p.weight || ""} placeholder="вес"
                    onBlur={e => e.target.value !== String(p.weight) && setWeight(p, e.target.value)}
                    className="w-20 rounded-lg px-2 py-1.5 outline-none text-sm"
                    style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, color: C.ink }} />
                  {p.weight > 0 && (
                    <span className="text-xs font-bold" style={{ color: C.ink, fontFamily: F.mono }}>
                      {priceKZT(p.weight, rate).toLocaleString("ru-RU")} ₸
                    </span>
                  )}
                  <button onClick={() => togglePaid(p)} className="text-xs font-bold px-2 py-1 rounded-lg ml-auto"
                    style={{ background: p.paid ? C.ready + "22" : C.line + "33", color: p.paid ? C.ready : C.inkSoft, fontFamily: F.body }}>
                    {p.paid ? "Оплачено" : "Не оплачено"}
                  </button>
                </div>
                {p.status < 5 ? (
                  <button onClick={() => advance(p)} className="w-full text-xs font-bold py-2 rounded-lg text-white transition-all active:scale-[0.98]"
                    style={{ background: C.transit, fontFamily: F.body }}>
                    → {STATUSES[p.status + 1].label}
                  </button>
                ) : (
                  <div className="text-xs font-bold text-center" style={{ color: C.stamp, fontFamily: F.body }}>✔ Завершено</div>
                )}
              </div>
            ))}
          </>
        )}

        {tab === "clients" && (
          <>
            {loading && <div className="text-sm text-center py-8" style={{ color: C.inkSoft, fontFamily: F.body }}>Загрузка…</div>}
            {!loading && clients.length === 0 && (
              <div className="text-sm text-center py-8" style={{ color: C.inkSoft, fontFamily: F.body }}>
                Пока нет клиентов.
              </div>
            )}
            {clients.map(c => (
              <div key={c.id} className="rounded-xl p-4 mb-3 slide-up"
                style={{ background: C.card, border: `1px solid ${C.line}` }}>
                <div className="flex items-center justify-between">
                  <div>
                    <div className="text-sm font-bold" style={{ color: C.ink, fontFamily: F.body }}>
                      {c.full_name || "—"}
                    </div>
                    <div className="text-xs" style={{ color: C.inkSoft, fontFamily: F.body }}>
                      {c.phone || "Нет телефона"}
                    </div>
                    <div className="text-xs mt-1" style={{ color: C.inkSoft, fontFamily: F.mono }}>
                      Код: {c.client_code}
                    </div>
                  </div>
                  <div className="flex flex-col items-end gap-1">
                    <button
                      onClick={() => resetUserPassword(c)}
                      className="text-xs font-bold px-3 py-1.5 rounded-lg transition-all active:scale-95"
                      style={{
                        background: C.stamp + "22",
                        color: C.stamp,
                        fontFamily: F.body,
                        border: `1px solid ${C.stamp}33`
                      }}
                      title="Задать новый пароль пользователю"
                    >
                      🔑 Сменить пароль
                    </button>
                  </div>
                </div>
              </div>
            ))}
          </>
        )}

        {tab === "settings" && (
          <>
            {/* Экспорт в Excel */}
            <div className="rounded-2xl p-5 mb-4 slide-up" style={{ background: C.card, border: `1px solid ${C.line}` }}>
              <div className="text-sm font-bold mb-1" style={{ color: C.ink, fontFamily: F.body }}>📊 Экспорт в Excel</div>
              <div className="text-xs mb-3" style={{ color: C.inkSoft, fontFamily: F.body }}>
                Все посылки за период: трек, клиент, статус, вес, сумма, оплата. Файл открывается в Excel.
              </div>
              <div className="flex gap-2 mb-3">
                <div className="flex-1">
                  <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>С даты</label>
                  <input type="date" value={exportFrom} onChange={e => setExportFrom(e.target.value)}
                    className="w-full rounded-xl px-3 py-2.5 outline-none text-sm"
                    style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, color: C.ink }} />
                </div>
                <div className="flex-1">
                  <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>По дату</label>
                  <input type="date" value={exportTo} onChange={e => setExportTo(e.target.value)}
                    className="w-full rounded-xl px-3 py-2.5 outline-none text-sm"
                    style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, color: C.ink }} />
                </div>
              </div>
              <div className="text-xs mb-3" style={{ color: C.inkSoft, fontFamily: F.body }}>
                Оставьте даты пустыми, чтобы выгрузить всё.
              </div>
              <button
                onClick={() => exportToExcel(parcels, rate, exportFrom, exportTo)}
                className="w-full py-3 rounded-xl font-bold text-white transition-all active:scale-[0.98]"
                style={{ background: C.transit, fontFamily: F.body }}
              >
                ⬇ Скачать таблицу
              </button>
            </div>

            <SettingsForm settings={settings} onSaved={reloadSettings} />
          </>
        )}
      </div>

      <div className="fixed bottom-0 left-0 right-0 flex z-10" style={{ background: C.card, borderTop: `1px solid ${C.line}` }}>
        {[
          ["parcels", "📦", "Посылки"],
          ["clients", "👤", "Клиенты"],
          ["settings", "⚙️", "Настройки"]
        ].map(([id, icon, label]) => (
          <button key={id} onClick={() => setTab(id)} className="flex-1 py-3 text-center"
            style={{
              color: tab === id ? C.stamp : C.inkSoft,
              fontFamily: F.body,
              borderTop: tab === id ? `3px solid ${C.stamp}` : "3px solid transparent"
            }}>
            <div className="text-lg">{icon}</div>
            <div className="text-xs font-semibold">{label}</div>
          </button>
        ))}
      </div>

      {showScanner && (
        <QRScanner
          continuous
          onScan={handleScan}
          onClose={() => setShowScanner(false)}
          feedback={scanFeedback}
          scanCount={scanCount}
        />
      )}
    </div>
  );
}

// ─── Поле настроек (вне SettingsForm — иначе инпут теряет фокус) ───
function SettingsField({ label, value, onChange, type }) {
  return (
    <div className="mb-3">
      <label className="block text-xs font-semibold mb-1" style={{ color: C.inkSoft, fontFamily: F.body }}>{label}</label>
      <input type={type || "text"} value={value || ""} onChange={e => onChange(e.target.value)}
        className="w-full rounded-xl px-4 py-2.5 outline-none"
        style={{ border: `1.5px solid ${C.line}`, fontFamily: F.mono, fontSize: 14, color: C.ink }} />
    </div>
  );
}

// ─── Настройки ──────────────────────────────────────────────────
function SettingsForm({ settings, onSaved }) {
  const [f, setF] = useState({ ...settings });
  const [busy, setBusy] = useState(false);
  const [ok, setOk] = useState(false);
  const upd = (k, v) => setF(s => ({ ...s, [k]: v }));

  const save = async () => {
    setBusy(true);
    setOk(false);
    const { error } = await db.from("settings").update({
      rate_per_kg: parseFloat(f.rate_per_kg) || 0,
      china_recipient: f.china_recipient,
      china_phone: f.china_phone,
      china_region: f.china_region,
      china_street: f.china_street,
      code_prefix: f.code_prefix
    }).eq("id", 1);
    setBusy(false);
    if (error) alert(error.message);
    else { setOk(true); if (onSaved) onSaved(); setTimeout(() => setOk(false), 1500); }
  };

  return (
    <div className="rounded-2xl p-5 slide-up" style={{ background: C.card, border: `1px solid ${C.line}` }}>
      <div className="text-sm font-bold mb-4" style={{ color: C.ink, fontFamily: F.body }}>⚙️ Настройки карго</div>
      <SettingsField label="Тариф, ₸ за кг" value={f.rate_per_kg} onChange={v => upd("rate_per_kg", v)} type="number" />
      <SettingsField label="Префикс кодов клиентов" value={f.code_prefix} onChange={v => upd("code_prefix", v)} />
      <div className="my-4" style={{ borderTop: `2px dashed ${C.line}` }}></div>
      <div className="text-xs font-bold mb-2" style={{ color: C.inkSoft, fontFamily: F.body }}>📍 Адрес склада в Китае</div>
      <SettingsField label="收货人 Получатель" value={f.china_recipient} onChange={v => upd("china_recipient", v)} />
      <SettingsField label="电话 Телефон" value={f.china_phone} onChange={v => upd("china_phone", v)} />
      <SettingsField label="地区 Регион" value={f.china_region} onChange={v => upd("china_region", v)} />
      <SettingsField label="详细地址 Адрес" value={f.china_street} onChange={v => upd("china_street", v)} />
      <button onClick={save} disabled={busy} className="w-full py-3 rounded-xl font-bold text-white mt-2 transition-all active:scale-[0.98]"
        style={{ background: ok ? C.ready : C.stamp, fontFamily: F.body, opacity: busy ? 0.6 : 1 }}>
        {busy ? "Сохранение…" : ok ? "✅ Сохранено" : "💾 Сохранить"}
      </button>
    </div>
  );
}

// ─── Корень ─────────────────────────────────────────────────────
function App() {
  const [session, setSession] = useState(undefined);
  const [profile, setProfile] = useState(null);
  const [settings, setSettings] = useState(null);
  const [ready, setReady] = useState(false);

  const loadSettings = async () => {
    const { data } = await db.from("settings").select("*").eq("id", 1).single();
    setSettings(data);
  };

  const loadProfile = async (userId) => {
    if (!userId) { setProfile(null); return; }
    const { data } = await db.from("profiles").select("*").eq("id", userId).single();
    setProfile(data);
  };

  useEffect(() => {
    db.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = db.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (session === undefined) return;
    if (!session) { setReady(true); setProfile(null); return; }
    setReady(false);
    Promise.all([loadProfile(session.user.id), loadSettings()]).then(() => setReady(true));
  }, [session]);

  if (session === undefined || !ready) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center" style={{ background: C.ink }}>
        <div className="inline-block w-10 h-10 rounded-full border-t-transparent animate-spin"
          style={{ border: `3px solid ${C.stamp}`, borderTopColor: "transparent" }}></div>
        <div className="mt-4 text-sm" style={{ color: "#9AA6B5", fontFamily: F.body }}>Загрузка…</div>
      </div>
    );
  }

  if (!session) return <Auth />;
  if (!profile) return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center gap-4" style={{ background: C.ink, color: "#fff", fontFamily: F.body }}>
      <div>Профиль не найден. Обратитесь в поддержку.</div>
      <button onClick={() => db.auth.signOut()} className="px-6 py-2 rounded-lg text-sm font-bold" style={{ background: C.stamp, color: "#fff" }}>
        Выйти
      </button>
    </div>
  );

  const logout = () => db.auth.signOut();
  return profile.role === "admin"
    ? <AdminApp settings={settings} reloadSettings={loadSettings} onLogout={logout} />
    : <ClientApp session={session} profile={profile} settings={settings} onLogout={logout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
